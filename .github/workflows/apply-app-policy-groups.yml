name: Apply Surge App Policy-Group Consolidation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_app_policy_groups.py'
      - '.github/scripts/enforce_explicit_exclusions.py'
      - '.github/explicit-rule-exclusions.json'
      - '.github/workflows/apply-app-policy-groups.yml'
      - 'Rule/CONSOLIDATION-PLAN.json'

permissions:
  contents: write

concurrency:
  group: surge-rule-maintenance
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Enforce permanent user-directed folder exclusions before consolidation
        run: python3 .github/scripts/enforce_explicit_exclusions.py

      - name: Merge approved App variants and remove duplicate folders
        run: python3 .github/scripts/apply_app_policy_groups.py

      - name: Re-enforce permanent exclusions after consolidation
        run: python3 .github/scripts/enforce_explicit_exclusions.py

      - name: Commit consolidated App folders
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- Rule/Upstream
          if git diff --cached --quiet; then
            echo 'No App consolidation changes'
            exit 0
          fi
          git commit -m 'Consolidate regional Surge rule folders into App policy groups'
          git push origin HEAD:main

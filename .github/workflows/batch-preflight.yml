name: Surge Single-Source Sync and Security Check

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_blackmatrix7.py'
      - '.github/workflows/batch-preflight.yml'
      - '.github/explicit-rule-exclusions.json'
      - 'Rule/Upstream/README.md'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: surge-single-source-sync
  cancel-in-progress: false

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile-check sync script and validate deletion manifest
        id: preflight
        run: |
          python -m py_compile .github/scripts/sync_blackmatrix7.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path(".github/explicit-rule-exclusions.json").read_text(encoding="utf-8"))
          assert p.get("schema_version") == 2
          assert isinstance(p.get("exclusions"), list)
          assert isinstance(p.get("rule_lines"), list)
          for item in p["rule_lines"]:
              assert item["path"].startswith("Rule/Upstream/") and item["path"].endswith(".list")
              assert item["rule"].strip()
          print("deletion manifest schema valid")
          PY

      - name: Download OpenPhish intelligence
        id: feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/surge-feeds"
          curl -fsSL --retry 3 --retry-all-errors --max-time 90 \
            https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt \
            -o "$RUNNER_TEMP/surge-feeds/openphish.txt"
          test -s "$RUNNER_TEMP/surge-feeds/openphish.txt"
          grep -qE '^https?://' "$RUNNER_TEMP/surge-feeds/openphish.txt"


      - name: Publish with concurrent-update retry
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            rm -f "$RUNNER_TEMP/surge-report-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
            git fetch origin main
            git reset --hard origin/main
            ARGS=(--openphish "$RUNNER_TEMP/surge-feeds/openphish.txt" --output "$RUNNER_TEMP/surge-report-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json")
            python3 .github/scripts/sync_blackmatrix7.py "${ARGS[@]}"
            cp "$RUNNER_TEMP/surge-report-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" Rule/Upstream/SECURITY-SYNC-REPORT.json
            git add -A -- Rule/Upstream
            if git diff --cached --quiet; then
              echo "No upstream rule or security report changes."
              exit 0
            fi
            git commit -m "Sync blackmatrix7 Surge rules and run full security validation"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Main advanced during publication; rebuilding from latest main (attempt $attempt of 3)."
          done
          echo "Could not publish after three retries."
          exit 1

      - name: Summarize security coverage and validation
        if: always()
        shell: bash
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          steps = json.loads(os.environ["STEP_OUTCOMES"])
          print("## Surge single-source sync")
          for name in ("checkout", "python", "preflight", "feed", "publish"):
              print(f"- {name}: {steps.get(name, {}).get('outcome', 'skipped')}")

          run = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          report = Path(os.environ["RUNNER_TEMP"]) / f"surge-report-{run}-{attempt}.json"
          if not report.is_file():
              print("This attempt produced no report.")
          else:
              p = json.loads(report.read_text(encoding="utf-8"))
              print("- Source commit:", p["source_commit"])
              print("- Rule files:", p["validation"]["rule_files"])
              print("- Rule folders:", p["validation"]["rule_folders"])
              print("- OpenPhish hosts:", p["openphish_hosts"])
              print("- Exact OpenPhish matches:", len(p["openphish_exact_matches"]))
              print("- New removals:", len(p["removed_exact_domain_rules"]))
              print("- Validation errors:", len(p["validation_errors"]))
              print("- Personal rules unchanged:", p["rule_personal_unchanged"])
          PY

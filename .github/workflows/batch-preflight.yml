name: Surge Automatic 100-Folder Batch Preflight

on:
  push:
    branches: [main]
    paths:
      - 'Rule/Upstream/**/*.list'
      - '.github/scripts/batch_preflight.py'
      - '.github/workflows/batch-preflight.yml'
      - '.github/explicit-rule-exclusions.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surge-rule-batch-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run all 100-folder batches in sequence
        id: batches
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p batch-output
          TOTAL=$(python3 -c 'from pathlib import Path; p=Path("Rule/Upstream"); print(sum(1 for x in p.iterdir() if x.is_dir() and not x.is_symlink() and x.name != "SourceMetadata"))')
          BATCHES=$(((TOTAL + 99) / 100))
          echo "Eligible folders: $TOTAL; batches: $BATCHES"
          FAILED=0
          for ((BATCH=1; BATCH<=BATCHES; BATCH++)); do
            echo "::group::Batch $BATCH of $BATCHES"
            python3 .github/scripts/batch_preflight.py \
              --batch "$BATCH" \
              --batch-size 100 \
              --output-dir batch-output
            RESULT=$?
            echo "::endgroup::"
            if [ "$RESULT" -ne 0 ]; then
              echo "BLOCKED_AT_BATCH=$BATCH" > batch-output/BATCH-STATUS.txt
              echo "Preflight stopped at batch $BATCH; later batches were not started." >> batch-output/BATCH-STATUS.txt
              FAILED=1
              break
            fi
          done
          if [ "$FAILED" -eq 0 ]; then
            echo "ALL_BATCHES_PASSED=$BATCHES" > batch-output/BATCH-STATUS.txt
            echo "All $BATCHES batches completed read-only preflight." >> batch-output/BATCH-STATUS.txt
          fi
          echo "Preflight loop finished; blocked=$FAILED"
          exit 0

      - name: Add combined batch summary
        if: always()
        run: |
          if [ -f batch-output/BATCH-STATUS.txt ]; then
            cat batch-output/BATCH-STATUS.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          for report in batch-output/batch-*.md; do
            [ -f "$report" ] || continue
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload all batch reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surge-rule-batches-${{ github.run_number }}
          path: batch-output/
          if-no-files-found: error
          retention-days: 30

      - name: Mark workflow failed if a batch was blocked
        if: always()
        run: |
          if grep -q '^BLOCKED_AT_BATCH=' batch-output/BATCH-STATUS.txt 2>/dev/null; then
            echo "One batch has blocking findings. Reports are uploaded; inspect and fix before retrying."
            exit 1
          fi

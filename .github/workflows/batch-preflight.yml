name: Surge Single-Source Sync and Security Check

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_blackmatrix7.py'
      - '.github/workflows/batch-preflight.yml'
      - 'Rule/Upstream/README.md'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: surge-single-source-sync
  cancel-in-progress: false

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile-check sync script and validate deletion manifest
        run: |
          python -m py_compile .github/scripts/sync_blackmatrix7.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path(".github/explicit-rule-exclusions.json").read_text(encoding="utf-8"))
          assert p.get("schema_version") == 2
          assert isinstance(p.get("exclusions"), list)
          assert isinstance(p.get("rule_lines"), list)
          for item in p["rule_lines"]:
              assert item["path"].startswith("Rule/Upstream/") and item["path"].endswith(".list")
              assert item["rule"].strip()
          print("deletion manifest schema valid")
          PY

      - name: Download phishing and malware intelligence
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/surge-feeds"
          curl -fsSL --retry 3 --retry-all-errors --max-time 90 \
            https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt \
            -o "$RUNNER_TEMP/surge-feeds/openphish.txt"
          test -s "$RUNNER_TEMP/surge-feeds/openphish.txt"
          grep -qE '^https?://' "$RUNNER_TEMP/surge-feeds/openphish.txt"

          if [ -n "${URLHAUS_AUTH_KEY:-}" ] && curl -fsSL --retry 2 --retry-all-errors --max-time 90 \
            "https://urlhaus-api.abuse.ch/v2/files/exports/${URLHAUS_AUTH_KEY}/hostfile.txt" \
            -o "$RUNNER_TEMP/surge-feeds/urlhaus.txt" && test -s "$RUNNER_TEMP/surge-feeds/urlhaus.txt"; then
            echo "URLHAUS_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            rm -f "$RUNNER_TEMP/surge-feeds/urlhaus.txt"
            echo "URLHAUS_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::URLhaus unavailable; automatic threat deletion will be disabled for this run."
          fi

      - name: Publish with concurrent-update retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            ARGS=(--openphish "$RUNNER_TEMP/surge-feeds/openphish.txt" --output Rule/Upstream/SECURITY-SYNC-REPORT.json)
            if [ "$URLHAUS_AVAILABLE" = "true" ]; then
              ARGS+=(--urlhaus "$RUNNER_TEMP/surge-feeds/urlhaus.txt")
            fi
            python3 .github/scripts/sync_blackmatrix7.py "${ARGS[@]}"
            git add -A -- Rule/Upstream
            if git diff --cached --quiet; then
              echo "No upstream rule or security report changes."
              exit 0
            fi
            git commit -m "Sync blackmatrix7 Surge rules and run full security validation"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Main advanced during publication; rebuilding from latest main (attempt $attempt of 3)."
          done
          echo "Could not publish after three retries."
          exit 1

      - name: Summarize security coverage and validation
        if: always()
        run: |
          if [ -f Rule/Upstream/SECURITY-SYNC-REPORT.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("Rule/Upstream/SECURITY-SYNC-REPORT.json",encoding="utf-8"))
          print("## Surge single-source sync")
          print("- Source:", p.get("source"), "commit", p.get("source_commit"))
          print("- Imported rule files:", p.get("upstream_rule_files"))
          print("- Rule folders:", p.get("validation",{}).get("rule_folders"))
          print("- Exact high-confidence removals:", len(p.get("removed_exact_domain_rules",[])))
          print("- Automatic deletion enabled:", p.get("automatic_deletion_enabled"))
          print("- Validation errors:", len(p.get("validation_errors",[])))
          print("- Coverage:", p.get("coverage_note"))
          PY
          fi

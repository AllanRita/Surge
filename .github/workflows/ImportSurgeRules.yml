name: Sync Upstream Surge Rules
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/ImportSurgeRules.yml']
permissions:
  contents: read
concurrency:
  group: import-surge-rules
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Copy upstream rules without executing upstream code
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/blackmatrix7/ios_rule_script.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" sparse-checkout set rule/Surge
          python3 - <<'PY'
          import os, shutil, subprocess, hashlib, re, json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'upstream'
          src=root/'rule/Surge'
          dst=Path('Rule/Upstream')
          if dst.is_symlink() or (dst.exists() and not dst.is_dir()):
              raise SystemExit('Unsafe destination')
          if dst.exists() and any(p.is_symlink() for p in dst.rglob('*')):
              raise SystemExit('Unsafe existing tree')
          if Path('Rule').is_symlink():
              raise SystemExit('Unsafe destination')
          files=[p for p in src.rglob('*') if p.is_file() and p.suffix.lower() in {'.list','.txt','.md','.json','.conf'}]
          if not files or any(p.is_symlink() for p in src.rglob('*')):
              raise SystemExit('Invalid upstream tree')
          excluded=set(["AliPay","BOC","BOCOM","CCB","CEB","CGB","CMB","ICBC","PSBC","PayPal","Stripe","UnionPay","VISA","PingAn"])
          files=[p for p in files if p.relative_to(src).parts[0] not in excluded]
          rules=[p for p in files if p.suffix.lower() in {'.list','.txt','.conf'}]
          old_rules=[p for p in dst.rglob('*') if p.is_file() and p.suffix.lower() in {'.list','.txt','.conf'} and not p.with_suffix('.source.json').exists()]
          if len(rules)<100 or (old_rules and len(rules)<len(old_rules)*0.75):
              raise SystemExit('Abnormal upstream rule count; retaining previous snapshot')
          if any(p.stat().st_size>50*1024*1024 for p in files):
              raise SystemExit('Oversized upstream file')
          if sum(p.stat().st_size for p in files)>1024*1024*1024:
              raise SystemExit('Total size exceeds limit')
          skipped=[]
          for p in files:
              target=dst/p.relative_to(src)
              target.parent.mkdir(parents=True,exist_ok=True)
              if p.stat().st_size==0:
                  skipped.append(str(p.relative_to(src)))
                  continue
              if p.suffix.lower() in {'.list','.txt','.conf'}:
                  raw=p.read_bytes()
                  if b'\x00' in raw:
                      raise SystemExit('Binary data in rule file')
                  decoded=raw.decode('utf-8-sig')
                  if p.suffix.lower()=='.list':
                      lines=[l.strip() for l in decoded.splitlines() if l.strip() and not l.lstrip().startswith(('#',';','//'))]
                      if any(re.search(r'[\x00-\x08\x0b-\x1f\x7f]',l) or l.startswith('[') for l in lines):
                          raise SystemExit(f'Invalid rule content: {p.name}')
                      if target.exists():
                          old=target.read_text(encoding='utf-8-sig').split('\n# BEGIN MERGED SUPPLEMENT\n',1)[0].splitlines()
                          oldset={l.strip() for l in old if l.strip() and not l.lstrip().startswith(('#',';','//'))}
                          newset=set(lines)
                          if len(oldset)>=20 and len(oldset-newset)>max(10,len(oldset)*0.35):
                              raise SystemExit(f'Abnormal rule removal: {p.name}')
                          if len(newset-oldset)>max(100,len(oldset)*0.75):
                              raise SystemExit(f'Abnormal rule addition: {p.name}')
                          if any('://' in l for l in newset-oldset):
                              raise SystemExit(f'New external reference: {p.name}')
              shutil.copyfile(p,target)
          license_file=next(p for p in root.glob('LICENSE*') if p.is_file() and not p.is_symlink())
          shutil.copyfile(license_file,dst/'LICENSE')
          (dst/'UPSTREAM.md').write_text('Source: https://github.com/blackmatrix7/ios_rule_script/tree/master/rule/Surge\nLicense: GPL-2.0; original notices retained.\n')
          retained=sum(1 for p in dst.rglob('*') if p.is_file() and p.name not in {'LICENSE','UPSTREAM.md'} and not (src/p.relative_to(dst)).exists())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as report:
              report.write(f'Upstream files: {len(files)}\nRule files: {len(rules)}\nRetained removed files: {retained}\nSkipped empty files: {len(skipped)}\n')
          # Merge only explicitly matched service scopes. Keep independent cached contributions.
          extra=Path(os.environ['RUNNER_TEMP'])/'extra-source'
          cache=dst/'SourceMetadata'
          mapping={'microsoft':'Microsoft','apple_services':'Apple','gitlab':'GitLab','neteasemusic':'NetEaseMusic','telegram':'Telegram','stream_biliintl':'BiliBiliIntl'}
          try:
              subprocess.run(['git','clone','--depth','1','--filter=blob:none','--sparse','https://github.com/SukkaLab/ruleset.skk.moe.git',str(extra)],check=True)
              subprocess.run(['git','-C',str(extra),'sparse-checkout','set','List/non_ip'],check=True)
              lic=extra/'LICENSE'
              if not lic.is_file() or lic.is_symlink() or 'GNU AFFERO GENERAL PUBLIC LICENSE' not in lic.read_text():
                  raise ValueError('Unexpected license')
              commit=subprocess.check_output(['git','-C',str(extra),'rev-parse','HEAD'],text=True).strip()
              for stem,category in mapping.items():
                  p=extra/'List/non_ip'/f'{stem}.conf'
                  try:
                      if not p.is_file() or p.is_symlink() or not 0<p.stat().st_size<=50*1024*1024:
                          raise ValueError('Invalid source file')
                      raw=p.read_text(encoding='utf-8-sig')
                      rows=[]
                      for line in raw.splitlines():
                          line=line.strip()
                          if not line or line.startswith(('#',';','//')):
                              continue
                          parts=line.split(',')
                          if parts[0] not in {'DOMAIN','DOMAIN-SUFFIX'}:
                              continue
                          if len(parts)!=2:
                              raise ValueError('Invalid domain rule syntax')
                          domain=parts[1].lower()
                          if domain=='skk.moe' or domain.endswith('.skk.moe'):
                              continue
                          if not re.fullmatch(r'[A-Za-z0-9_-]+(?:[.][A-Za-z0-9_-]+)+',domain):
                              raise ValueError('Invalid domain rule syntax')
                          if any(domain==d or domain.endswith('.'+d) for d in ('paypal.com','alipay.com','stripe.com','unionpay.com','visa.com','icbc.com.cn','boc.cn','paypay.ne.jp')):
                              continue
                          rows.append(parts[0]+','+domain)
                      if not rows:
                          raise ValueError('Empty contribution')
                      cache.mkdir(exist_ok=True)
                      oldfile=cache/f'{category}.json'
                      old=json.loads(oldfile.read_text()) if oldfile.exists() else {}
                      previous=set(old.get('rules',[]))
                      if previous and len(previous-set(rows))>max(10,len(previous)*0.35):
                          raise ValueError('Abnormal contribution removal')
                      if previous and len(set(rows)-previous)>max(30,len(previous)*0.75):
                          raise ValueError('Abnormal contribution addition')
                      oldfile.write_text(json.dumps({'source':'https://github.com/SukkaLab/ruleset.skk.moe','commit':commit,'path':str(p.relative_to(extra)),'license':'AGPL-3.0','notices':[l for l in raw.splitlines() if l.startswith('#')],'rules':sorted(set(rows))},ensure_ascii=False,indent=2))
                  except (OSError,ValueError) as e:
                      print('Contribution deferred:',category,str(e))
                      with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as report:
                          report.write(f'- Contribution deferred: {category}: {e}\n')
              shutil.copyfile(lic,dst/'LICENSE-AGPL-3.0')
          except (OSError,ValueError,subprocess.CalledProcessError) as e:
              print('Additional source deferred:',str(e))
          for category in mapping.values():
              meta=cache/f'{category}.json'
              target=dst/category/f'{category}.list'
              if not meta.exists() or not target.exists():
                  continue
              info=json.loads(meta.read_text())
              base=target.read_text(encoding='utf-8-sig').split('\n# BEGIN MERGED SUPPLEMENT\n',1)[0]
              existing={l.strip().lower() for l in base.splitlines()}
              suffixes={l.split(',')[1].lower() for l in base.splitlines() if l.startswith('DOMAIN-SUFFIX,') and len(l.split(','))==2}
              added=[]
              for line in info['rules']:
                  kind,domain=line.split(',')
                  if kind not in {'DOMAIN','DOMAIN-SUFFIX'}:
                      continue
                  if line.lower() in existing or any('.'.join(domain.split('.')[i:]) in suffixes for i in range(len(domain.split('.')))):
                      continue
                  added.append(line)
              print('Merge result:',category,'added',len(added),'source rules',len(info['rules']))
              if added:
                  target.write_text(base.rstrip()+'\n# BEGIN MERGED SUPPLEMENT\n# Source: '+info['source']+'\n# License: AGPL-3.0; notices in SourceMetadata/'+category+'.json\n'+'\n'.join(added)+'\n',encoding='utf-8')
              else:
                  target.write_text(base,encoding='utf-8')
          import ipaddress, unicodedata, collections
          allowed={'DOMAIN','DOMAIN-SUFFIX','DOMAIN-KEYWORD','DOMAIN-WILDCARD','DOMAIN-REGEX','IP-CIDR','IP-CIDR6','IP-ASN','GEOIP','USER-AGENT','URL-REGEX','PROCESS-NAME','DEST-PORT','SRC-PORT','SRC-IP','IN-PORT','PROTOCOL','AND','OR','NOT','RULE-SET','DOMAIN-SET','SUBNET','DEVICE-NAME','HOST','HOST-SUFFIX','HOST-KEYWORD'}
          findings=collections.Counter()
          examples=[]
          financial_matches=[]
          finding_by_category=collections.defaultdict(collections.Counter)
          def flag(kind,path,num):
              findings[kind]+=1
              category=Path(path).parts[0] if Path(path).parts else 'unknown'
              finding_by_category[kind][category]+=1
              if len(examples)<80:
                  examples.append(f'{kind}: {path}:{num}')
          def audit_line(line,path,num):
              if any(unicodedata.category(c) in {'Cc','Cf','Cs'} and c!='\t' for c in line):
                  flag('hidden-control',path,num)
              if '://' in line:
                  flag('external-reference',path,num)
              # Upstream bundles can contain AdGuard-native filters as well as Surge rules.
              # Recognize their syntax without rewriting or translating it into broader Surge rules.
              native=line.strip()
              adguard=native[4:] if native.startswith('@@||') else (native[2:] if native.startswith('||') else '')
              if adguard:
                  host=re.split(r'[\^/$:*]',adguard,1)[0].strip('.')
                  if not re.fullmatch(r'(?i)[a-z0-9_-]+(?:\.[a-z0-9_-]+)+',host):
                      flag('invalid-native-filter',path,num)
                  else:
                      findings['recognized-native-filter']+=1
                  return
              if native.startswith('/') and native.endswith('/') and len(native)>2:
                  findings['recognized-native-regex']+=1
                  return
              # AdGuard domain-only lists use one hostname per line, commonly ".example.com".
              # Recognize these as native domain entries; do not convert them into Surge rules.
              bare=native[1:] if native.startswith('.') else native
              if ',' not in native and re.fullmatch(r'(?i)[a-z0-9_-]+(?:\.[a-z0-9_-]+)+',bare):
                  findings['recognized-native-domain']+=1
                  if re.fullmatch(
                      r'(?i)(?:[a-z0-9_-]+\.)*(?:paypal\.com|alipay\.com|stripe\.com|unionpay\.com|visa\.com|icbc\.com\.cn|boc\.cn|paypay\.ne\.jp)',
                      bare
                  ):
                      financial_matches.append((path,num,line.strip()))
                      flag('personal-financial-rule' if path.startswith('Rule/Personal/') else 'financial-domain-review',path,num)
                  return
              parts=line.split(',')
              kind=parts[0].strip().upper()
              if kind not in allowed:
                  flag('unsupported-rule-syntax',path,num)
                  return
              if len(parts)<2 or not parts[1].strip():
                  flag('missing-operand',path,num)
                  return
              value=parts[1].strip()
              if kind in {'IP-CIDR','IP-CIDR6'}:
                  try:
                      net=ipaddress.ip_network(value,strict=False)
                      if net.version!=(6 if kind=='IP-CIDR6' else 4):
                          flag('ip-family-mismatch',path,num)
                      if net.prefixlen==0:
                          flag('catch-all-network',path,num)
                  except ValueError:
                      flag('invalid-network',path,num)
              if kind in {'DOMAIN','DOMAIN-SUFFIX','HOST','HOST-SUFFIX'}:
                  labels=[]
                  try:
                      labels=value.rstrip('.').encode('idna').decode('ascii').split('.')
                      if any(not re.fullmatch(r'[A-Za-z0-9_](?:[A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?',x) for x in labels):
                          flag('invalid-domain',path,num)
                  except UnicodeError:
                      flag('invalid-domain',path,num)
                  if len(labels)<2:
                      flag('broad-domain',path,num)
              # Report exact financial-service host matches for manual scope review.
              # A match in an ad/tracker blocklist is not evidence that the service is routed.
              if kind in {'DOMAIN','DOMAIN-SUFFIX','HOST','HOST-SUFFIX'} and re.fullmatch(
                  r'(?i)(?:[a-z0-9_-]+\.)*(?:paypal\.com|alipay\.com|stripe\.com|unionpay\.com|visa\.com|icbc\.com\.cn|boc\.cn|paypay\.ne\.jp)',
                  value
              ):
                  financial_matches.append((path,num,line.strip()))
                  flag('personal-financial-rule' if path.startswith('Rule/Personal/') else 'financial-domain-review',path,num)
          # Whole-library consolidation: preserve rule order, options and comments.
          dedup_count=0
          duplicate_files=collections.defaultdict(list)
          for p in sorted(dst.rglob('*.list')):
              original=p.read_text(encoding='utf-8-sig')
              seen=set()
              output=[]
              for line in original.splitlines(keepends=True):
                  rule=line.strip()
                  if not rule or rule.startswith(('#',';','//')):
                      output.append(line)
                      continue
                  if rule in seen:
                      dedup_count+=1
                      continue
                  seen.add(rule)
                  output.append(line)
              if len(output)!=len(original.splitlines(keepends=True)):
                  p.write_text(''.join(output),encoding='utf-8')
              duplicate_files[hashlib.sha256('\n'.join(sorted(seen)).encode()).hexdigest()].append(str(p.relative_to(dst)))
          personal=Path('Rule/Personal')
          if personal.is_symlink() or any(p.is_symlink() for p in personal.rglob('*')):
              raise SystemExit('Unsafe personal tree')
          personal_count=0
          for p in sorted(personal.rglob('*.list')):
              personal_count+=1
              for num,line in enumerate(p.read_text(encoding='utf-8-sig').splitlines(),1):
                  line=line.strip()
                  if line and not line.startswith(('#',';','//')):
                      audit_line(line,str(p),num)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as report:
              report.write(f'\n### Whole-library consolidation\n- Exact duplicate rows removed: {dedup_count}\n- Personal files audited without changes: {personal_count}\n')
              groups=[v for v in duplicate_files.values() if len(v)>1]
              scenario_suffixes=('_All_No_Resolve','_All_NoResolve','_No_Resolve','_No_IPv6','_Resolve','_Domain','_All','_NoIPv6')
              def scenario_base(path):
                  stem=Path(path).stem
                  for suffix in scenario_suffixes:
                      if stem.endswith(suffix):
                          return stem[:-len(suffix)]
                  return stem
              scenario_variant_groups=[]
              cross_category_duplicate_groups=[]
              for group in groups:
                  bases={scenario_base(path) for path in group}
                  if len(bases)==1 and len({Path(path).stem for path in group})>1:
                      scenario_variant_groups.append(group)
                  else:
                      cross_category_duplicate_groups.append(group)
              report.write(f'- Identical rule-set groups (review only): {len(groups)}\n')
              for group in groups[:100]:
                  report.write('- '+ ' | '.join(group)+'\n')
          for p in sorted(dst.rglob('*.list')):
              for num,line in enumerate(p.read_text(encoding='utf-8-sig').splitlines(),1):
                  line=line.strip()
                  if line and not line.startswith(('#',';','//')):
                      audit_line(line,str(p.relative_to(dst)),num)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as report:
              report.write('\n### V3.2 full rule audit\n')
              for kind,count in sorted(findings.items()):
                  report.write(f'- {kind}: {count}\n')
              for example in examples:
                  report.write(f'- {example}\n')
          if any(findings[k] for k in ('hidden-control','invalid-network','ip-family-mismatch','catch-all-network','missing-operand')):
              raise SystemExit('Critical rule audit findings; publication blocked')
          # Persist the audit outcome in the repository so a green Actions badge is not mistaken for a clean audit.
          report_path=dst/'AUDIT-REPORT.md'
          report_lines=[
              '# Surge upstream rule audit',
              '',
              'Generated by .github/workflows/ImportSurgeRules.yml during the latest validation run.',
              'This report records static checks; it is not a guarantee that every domain is benign or that every routing behavior is correct.',
              '',
              '## Consolidation',
              f'- Exact duplicate rows removed: {dedup_count}',
              f'- Personal rule files audited without modification: {personal_count}',
              f'- Identical rule-set groups (review only): {len(groups)}',
              f'- Imported rule-list files: {sum(1 for p in dst.rglob("*.list"))}',
              '',
              '## Additional-source cache status',
          ]
          for category in mapping.values():
              meta=cache/f'{category}.json'
              report_lines.append(f'- {category}: {"cached" if meta.is_file() else "not cached"}')
          report_lines += ['', '## Static findings']
          if findings:
              for kind,count in sorted(findings.items()):
                  report_lines.append(f'- {kind}: {count}')
          else:
              report_lines.append('- No findings recorded.')
          report_lines += ['', '## Findings by rule category']
          for kind in ('financial-domain-review','broad-domain','unsupported-rule-syntax'):
              report_lines.append(f'### {kind}')
              breakdown=finding_by_category.get(kind,{})
              if breakdown:
                  report_lines += [f'- {category}: {count}' for category,count in sorted(breakdown.items())]
              else:
                  report_lines.append('- None')
          report_lines += ['', '## Same-app scenario variants (preserved; not merged)']
          for group in scenario_variant_groups:
              report_lines.append('- ' + ' | '.join(group))
          if not scenario_variant_groups:
              report_lines.append('- None')
          report_lines += ['', '## Cross-category identical-content candidates (manual review; not merged)']
          for group in cross_category_duplicate_groups:
              report_lines.append('- ' + ' | '.join(group))
          if not cross_category_duplicate_groups:
              report_lines.append('- None')
          report_lines += ['', '## Financial-domain matches (exact lines; manual review, no automatic deletion)']
          report_lines += [f'- {path}:{num}: {rule}' for path,num,rule in financial_matches] if financial_matches else ['- None']
          report_lines += ['', '## Finding examples']
          report_lines += [f'- {item}' for item in examples] if examples else ['- None']
          report_lines += ['', '## Scope and limitations',
              '- Personal rules are audited but not rewritten or merged into upstream lists.',
              '- Exact duplicate rows are removed only within each individual file; cross-file semantic deduplication is not claimed. Identical rule-set groups are reported for review and are not automatically merged.',
              '- Source license notices are retained in SourceMetadata where available.',
              '- Manual review is still required for source relevance, financial exclusions, broad matches, and real Surge subscription behavior.',
              '']
          report_path.write_text('\\n'.join(report_lines),encoding='utf-8')
          manifest={str(p.relative_to(dst)):hashlib.sha256(p.read_bytes()).hexdigest() for p in dst.rglob('*') if p.is_file()}
          Path('rule-manifest.json').write_text(json.dumps(manifest,sort_keys=True))
          print('Upstream commit:',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-rules
          path: |
            Rule/Upstream
            rule-manifest.json
          retention-days: 3
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-rules
          path: ${{ runner.temp }}/validated-rules
      - name: Verify and install validated snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, hashlib, shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'validated-rules'
          src=root/'Rule/Upstream'
          dst=Path('Rule/Upstream')
          expected=json.loads((root/'rule-manifest.json').read_text())
          if any(p.is_symlink() for p in src.rglob('*')):
              raise SystemExit('Unsafe artifact')
          actual={str(p.relative_to(src)):hashlib.sha256(p.read_bytes()).hexdigest() for p in src.rglob('*') if p.is_file()}
          if not actual or actual!=expected:
              raise SystemExit('Artifact integrity failure')
          if Path('Rule').is_symlink() or dst.is_symlink() or any(p.is_symlink() for p in dst.rglob('*')):
              raise SystemExit('Unsafe destination')
          if any(str(p.relative_to(dst)) not in actual for p in dst.rglob('*') if p.is_file()):
              raise SystemExit('Unexpected deletion')
          shutil.copytree(src,dst,dirs_exist_ok=True)
          PY
      - name: Publish imported rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Rule/Upstream
          git diff --cached --name-only -z | python3 -c 'import sys; assert all(p.startswith(b"Rule/Upstream/") for p in sys.stdin.buffer.read().split(b"\x00") if p)'
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Sync Blackmatrix7 Surge rules; retain removed upstream files'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main

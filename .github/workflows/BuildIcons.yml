
name: Build Icon Library

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: build-icon-library
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Secure checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Build and validate icon indexes
        run: |
          python3 - <<'PY'
          import json, re, time, os, math
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          from urllib.parse import urlsplit, unquote

          VERSION = '3.3 Security + Apple Auto'
          RAW = 'https://raw.githubusercontent.com/'
          APPLE = 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@16.0.0/'
          RSS = 'https://rss.marketingtools.apple.com/api/v2/'
          BASE = RAW+'AllanRita/Surge/main/Icon/'
          MAX_INPUT = 12*1024*1024
          MAX_OUTPUT = 50*1024*1024
          MAX_TOTAL = 150000

          SOURCES = [
              ('Qure-Color', RAW+'Koolson/Qure/master/Other/QureColor.json'),
              ('Qure-Mini', RAW+'Koolson/Qure/master/Other/Quremini.json'),
              ('Qure-Light', RAW+'Koolson/Qure/master/Other/QureLight-All.json'),
              ('Orz3-Color', RAW+'Orz-3/mini/master/miniColor.json'),
              ('Orz3-Alpha', RAW+'Orz-3/mini/master/miniAlpha.json'),
              ('Orz3-Mini', RAW+'Orz-3/mini/master/mini.json'),
              ('Orz3-ColorPlus', RAW+'Orz-3/mini/master/Color%2B.json'),
              ('Orz3-MiniPlus', RAW+'Orz-3/mini/master/mini%2B.json'),
              ('Lige', RAW+'lige47/lige_icon/main/ligeicon-surge.json'),
              ('Semporia', RAW+'Semporia/Hand-Painted-icon/master/Semporia.json'),
              ('Oasisic', RAW+'Hawaiine/Oasisic-Icons/main/config/surge-icon.json'),
              ('KeLee', RAW+'luestr/IconResource/main/KeLee_icon.json'),
              ('fmz200', RAW+'fmz200/wool_scripts/main/icons/icons-all.json'),
              ('KeLee-Flags', 'https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/ColorfulStaticFlag.json'),
          ]

          EXTRA = [
              ('Qure-Area', RAW+'Koolson/Qure/master/Other/QureColor-Area.json'),
              ('Qure-Media', RAW+'Koolson/Qure/master/Other/QureColor-Media.json'),
          ]

          IOS_APPS = [
              ('ADN',667935767,'fr','Media'),
              ('Mercari',667861049,'jp','Shopping'),
              ('Rakuten Viki',445553058,'us','Media'),
              ('FOX One',6746049430,'us','Media'),
              ('Amazon Shopping',297606951,'us','Shopping'),
              ('Target',297430070,'us','Shopping'),
              ('STARZ',550221096,'us','Media'),
              ('myTV SUPER',1080187984,'hk','Media'),
              ('Now TV',501956183,'hk','Media'),
          ]

          # Global App Store storefronts

          REGIONS = '''us gb hk tw jp kr sg cn ca au fr de af al dz ao ai ag ar am at az bs bh bb by be bz bj bm bt bo ba bw br vg bn bg bf kh cm cv ky td cl co cg cd cr ci hr cy cz dk dm do ec eg sv ee sz fj fi ga gm ge gh gr gd gt gw gy hn hu is in id iq ie il it jm jo kz ke xk kw kg la lv lb lr ly lt lu mo mg mw my mv ml mt mr mu mx fm md mn me ms ma mz mm na nr np nl nz ni ne ng mk no om pk pw pa pg py pe ph pl pt qa ro ru rw st sa sn rs sc sl sk si sb za es lk kn lc vc sr se ch tj tz th to tt tn tr tm tc ae ug ua uy uz vu ve vn ye zm zw'''.split()

          assert len(REGIONS) == len(set(REGIONS)) == 175

          CHARTS = ('top-free','top-paid')

          # Trusted image sources

          TRUSTED = {
              'Qure': [
                  RAW+'Koolson/Qure/master/IconSet/'
              ],
              'Orz3': [
                  RAW+'Orz-3/mini/master/'+p+'/'
                  for p in ('Color','Alpha')
              ],
              'Lige': [
                  RAW+'lige47/QuanX-icon-rule/main/icon/'
              ],
              'Semporia': [
                  RAW+'Semporia/Hand-Painted-icon/master/'+p+'/'
                  for p in (
                      'Rounded_Rectangle',
                      'Google_Suite',
                      'Social_Media',
                      'Universal'
                  )
              ],
              'Oasisic': [
                  RAW+'Hawaiine/Oasisic-Icons/main/icons/'
              ],
              'KeLee': [
                  RAW+'luestr/IconResource/main/'+p+'/'
                  for p in (
                      'App_icon',
                      'Other_icon',
                      'Website_icon'
                  )
              ],
              'KeLee-Flags': [
                  'https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/'
              ],
              'fmz200': [
                  RAW+'fmz200/wool_scripts/main/icons/'
              ],
              'Apple Emoji': [
                  APPLE+'img/apple/64/'
              ],
              'Personal': [
                  'https://cdn.jsdelivr.net/gh/selfhst/icons/png/',
                  'https://www.emojiall.com/images/240/apple/'
              ],
          }

          def valid_url(source, url):

              if not isinstance(url,str) or len(url)>2048 or any(ord(c)<=32 or ord(c)==127 for c in url):
                  return False

              try:
                  p=urlsplit(url)
              except ValueError:
                  return False

              if p.scheme!='https' or p.query or p.fragment or re.search(r'%(2f|5c|00|25)',url,re.I):
                  return False

              path=unquote(p.path)

              if re.search(r'[\x00-\x1f\x7f\\?#]',path) or any(x in {'.','..'} for x in path.split('/')):
                  return False

              if re.fullmatch(r'is[1-5](?:-ssl)?\.mzstatic\.com',p.netloc):
                  return (
                      source in {'iOS','Custom'}
                      and path.startswith('/image/thumb/')
                      and re.search(r'\.(png|jpe?g|webp)$',path,re.I) is not None
                  )

              if p.netloc=='play-lh.googleusercontent.com':
                  return (
                      source=='Custom'
                      and re.fullmatch(r'/[A-Za-z0-9_-]+(?:=w\d+-h\d+)?',path) is not None
                  )

              if not re.search(r'\.(png|jpe?g)$',path,re.I):
                  return False

              family=(
                  'Qure' if source.startswith('Qure-')
                  else 'Orz3' if source.startswith('Orz3-')
                  else source
              )

              prefixes=(
                  [x for group in TRUSTED.values() for x in group]
                  if source=='Custom'
                  else TRUSTED.get(family,[])
              )

              return any(
                  ('https://'+p.netloc+path).startswith(x)
                  for x in prefixes
              )

          def name_ok(name):
              return (
                  isinstance(name,str)
                  and bool(name.strip())
                  and len(name)<=240
                  and not re.search(r'[\x00-\x1f\x7f]',name)
              )

          def clean(source, rows):

              if not isinstance(rows,list) or len(rows)>MAX_TOTAL:
                  raise ValueError('Invalid list: '+source)

              out=[]

              for r in rows:

                  if not isinstance(r,dict) or not name_ok(r.get('name')) or not valid_url(source,r.get('url')):
                      raise ValueError('SECURITY BLOCK: invalid record in '+source)

                  out.append({
                      'name':re.sub(
                          r'\.(png|jpe?g|webp|svg|gif)$',
                          '',
                          r['name'].strip(),
                          flags=re.I
                      ),
                      'url':r['url'],
                      'source':source,
                      'category':str(r.get('category') or '')
                  })

              if not out and source!='Custom':
                  raise ValueError('Empty source: '+source)

              return out

          def pack(rows):

              out=[]
              urls=set()
              names=set()

              for r in rows:

                  key=unquote(r['url'])

                  if key in urls:
                      continue

                  urls.add(key)

                  base=r['name']+' · '+r['source']
                  name=base
                  n=2

                  while name.casefold() in names:
                      name=base+' '+str(n)
                      n+=1

                  names.add(name.casefold())

                  out.append({
                      'name':name,
                      'url':r['url']
                  })

              return sorted(
                  out,
                  key=lambda r:(
                      r['name'].casefold(),
                      r['url']
                  )
              )

          # Secure HTTP requests

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None

          opener=build_opener(NoRedirect())

          def lookup_url(a,c):
              return f'https://itunes.apple.com/lookup?id={a}&country={c}&entity=software'

          def chart_url(c,chart):
              return RSS+f'{c}/apps/{chart}/100/apps.json'

          allowed=(
              {u for _,u in SOURCES+EXTRA}
              | {APPLE+'emoji.json'}
              | {lookup_url(a,c) for _,a,c,_ in IOS_APPS}
              | {chart_url(c,t) for c in REGIONS for t in CHARTS}
          )

          def fetch(url, attempts=3, timeout=35):

              if url not in allowed:
                  raise ValueError('Unapproved index URL')

              for i in range(attempts):

                  try:

                      req=Request(
                          url,
                          headers={
                              'User-Agent':'AllanRita-IconIndex/3.3',
                              'Accept':'application/json,*/*'
                          }
                      )

                      with opener.open(req,timeout=timeout) as res:

                          if res.geturl()!=url:
                              raise ValueError('Redirect blocked')

                          raw=res.read(MAX_INPUT+1)

                      if len(raw)>MAX_INPUT:
                          raise ValueError('Input size limit')

                      return json.loads(raw)

                  except HTTPError as e:

                      if e.code in (403,404,429):
                          raise

                      if i+1==attempts:
                          raise

                  except (OSError,ValueError):

                      if i+1==attempts:
                          raise

                  time.sleep(2**i)

          def safe_path(file):

              p=Path('Icon')/file

              if any(x.is_symlink() for x in [p,*p.parents]):
                  raise ValueError('Unsafe output path')

              return p

          def read(file,default=None):

              p=safe_path(file)

              if not p.exists():
                  return default

              if p.stat().st_size>MAX_OUTPUT:
                  raise ValueError('Existing index too large: '+file)

              return json.loads(
                  p.read_text(encoding='utf-8')
              )

          # Original icon libraries

          data={
              s:clean(s,fetch(u)['icons'])
              for s,u in SOURCES+EXTRA
          }

          core=[
              r
              for s,_ in SOURCES+EXTRA
              for r in data[s]
          ]

          # Preserve all custom icons

          custom=read(
              'Custom.json',
              {'icons':[]}
          )

          core=clean(
              'Custom',
              custom['icons']
          )+core

          # Existing selected Apple applications

          ios=[]

          old_ios=read(
              'Packs/Apple-iOS.json',
              {'icons':[]}
          )['icons']

          old_ios_by_name={
              r['name']:r['url']
              for r in old_ios
          }

          lookup_warnings=[]

          for name,app_id,country,category in IOS_APPS:

              try:

                  result=fetch(
                      lookup_url(app_id,country)
                  )['results']

                  matches=[
                      r for r in result
                      if str(r.get('trackId'))==str(app_id)
                  ]

                  if len(matches)!=1:
                      raise ValueError('App ID mismatch')

                  artwork=(
                      matches[0].get('artworkUrl512')
                      or matches[0].get('artworkUrl100')
                  )

                  if not valid_url('iOS',artwork):
                      raise ValueError('Unsafe Apple artwork')

              except Exception:

                  artwork=old_ios_by_name.get(name+' · iOS')

                  if not valid_url('iOS',artwork):
                      raise ValueError('Missing trusted fallback: '+name)

                  lookup_warnings.append(name)

              ios.append({
                  'name':name,
                  'url':artwork,
                  'category':category
              })

              time.sleep(3.2)

          ios=clean('iOS',ios)

          core=ios+core

          # Apple Color Emoji

          emoji=[]

          for e in fetch(APPLE+'emoji.json'):

              if not isinstance(e,dict) or e.get('obsoleted_by'):
                  continue

              name=(
                  e.get('name')
                  or e.get('short_name')
                  or e.get('unified')
                  or 'Emoji'
              )

              parts=(e.get('unified') or '').split('-')

              region=''

              if len(parts)==2 and all(
                  re.fullmatch(r'1F1[E-F][0-9A-F]',p,re.I)
                  and 0x1F1E6<=int(p,16)<=0x1F1FF
                  for p in parts
              ):

                  region=''.join(
                      chr(int(p,16)-0x1F1E6+65)
                      for p in parts
                  )

              category=(
                  'Country'
                  if region or e.get('subcategory') in {
                      'country-flag',
                      'subdivision-flag'
                  }
                  else 'Emoji'
              )

              if region:
                  name=region+' · '+name

              variants=[(e,name)]+[
                  (v,name+' · '+k)
                  for k,v in (
                      e.get('skin_variations') or {}
                  ).items()
              ]

              for v,label in variants:

                  image=v.get('image') or ''

                  if (
                      v.get('has_img_apple') is True
                      and re.fullmatch(r'[0-9a-f-]+\.png',image,re.I)
                  ):

                      emoji.append({
                          'name':label,
                          'url':APPLE+'img/apple/64/'+image,
                          'category':category
                      })

          emoji=clean('Apple Emoji',emoji)

          apple_flags=[
              r for r in emoji
              if r['category']=='Country'
          ]

          if len(emoji)<1000 or len(apple_flags)<200:
              raise ValueError('Incomplete Emoji source')

          # ===================================
          # Global Apple App Store archive
          # ===================================

          saved=read(
              'Apple-Catalog.json',
              {
                  'apps':{},
                  'next_chart':0
              }
          )

          old_archive=saved['apps']

          if not isinstance(old_archive,dict):
              raise ValueError('Invalid Apple archive')

          def valid_app(k,r):

              return (
                  isinstance(k,str)
                  and re.fullmatch(r'[0-9]{1,20}',k) is not None
                  and isinstance(r,dict)
                  and name_ok(r.get('name'))
                  and valid_url('iOS',r.get('url'))
                  and r.get('country') in REGIONS
              )

          if not all(
              valid_app(k,r)
              for k,r in old_archive.items()
          ):
              raise ValueError('Invalid saved Apple archive')

          archive=dict(old_archive)

          found={}
          failures=[]
          successes=[]
          stop=False

          fixed_ids={
              str(a)
              for _,a,_,_ in IOS_APPS
          }

          region_rank={
              country:i
              for i,country in enumerate(REGIONS)
          }

          queue=[
              (country,chart)
              for country in REGIONS
              for chart in CHARTS
          ]

          start=saved.get('next_chart',0)

          if type(start) is not int or not 0<=start<len(queue):
              raise ValueError('Invalid chart cursor')

          next_chart=start
          consecutive_denied=0
          attempted=0

          deadline=time.monotonic()+40*60

          # Fetch up to 350 Apple charts

          for offset in range(len(queue)):

              if time.monotonic()>=deadline:

                  failures.append(
                      'Time budget reached; resume next run'
                  )

                  break

              index=(start+offset)%len(queue)

              country,chart=queue[index]

              next_chart=(index+1)%len(queue)

              attempted+=1

              label=country+'/'+chart

              try:

                  feed=fetch(
                      chart_url(country,chart),
                      attempts=1,
                      timeout=12
                  )['feed']

                  if feed.get('country','').lower()!=country:
                      raise ValueError('Storefront mismatch')

                  results=feed['results']

                  if not isinstance(results,list) or not 1<=len(results)<=100:
                      raise ValueError('Invalid chart results')

                  batch={}

                  for r in results:

                      key=str(r['id'])
                      name=r['name']
                      url=r['artworkUrl100']

                      entry={
                          'name':name,
                          'url':url,
                          'country':country
                      }

                      if not valid_app(key,entry) or r.get('kind')!='apps':
                          raise ValueError('Invalid chart entry')

                      if key not in fixed_ids:
                          batch[key]=entry

                  for key,entry in batch.items():

                      if key not in found or region_rank[country]<region_rank[found[key]['country']]:

                          found[key]=entry

                  successes.append(label)

                  consecutive_denied=0

              except HTTPError as e:

                  failures.append(
                      label+' HTTP '+str(e.code)
                  )

                  consecutive_denied=(
                      consecutive_denied+1
                      if e.code==403
                      else 0
                  )

                  if e.code==429 or consecutive_denied>=5:
                      stop=True

              except Exception:

                  failures.append(
                      label+' unavailable/invalid'
                  )

                  consecutive_denied=0

              if stop:
                  break

              time.sleep(3.2)

          if stop:

              failures.append(
                  'Remaining charts skipped after rate limit/access denial; resume next run'
              )

          if not old_archive and not found:
              raise ValueError('No new valid Apple apps; previous library retained')

          # Merge historical app records

          for key,entry in found.items():

              if key not in archive or region_rank[entry['country']]<=region_rank[archive[key]['country']]:

                  archive[key]=entry

          if len(archive)>MAX_TOTAL:
              raise ValueError('Archive capacity exceeded; previous library retained')

          auto=clean(
              'iOS',
              [
                  {
                      'name':r['name'],
                      'url':r['url'],
                      'category':'Auto'
                  }
                  for k,r in archive.items()
                  if k not in fixed_ids
              ]
          )

          # ===================================
          # Country and region icons
          # ===================================

          flags=(
              data['KeLee-Flags']
              +data['Qure-Area']
              +[
                  r for r in core
                  if r['category'].casefold() in {
                      'country',
                      'region',
                      'flag',
                      'flags'
                  }
              ]
              +apple_flags
          )

          # Streaming and music

          media_pattern=re.compile(
              r'youtube|netflix|disney|hbo|\bmax\b|hulu|prime.?video|amazon.?video|spotify|paramount|\bviu\b|abema|u.?next|bahamut|baha|巴哈|动画疯|動畫瘋|emby|plex|tver|peacock|dazn|bilibili|twitch|crunchyroll|apple.?tv|\badn\b|animation.?digital.?network|kktv|iqiyi|wetv|fox.?one|rakuten.?viki|sling|starz|fubo|espn|discovery|mytv.?super|now.?tv|now.?player',
              re.I
          )

          media=(
              data['Qure-Media']
              +[
                  r for r in core
                  if r['category'].casefold() in {
                      'media',
                      'music',
                      'streaming',
                      'disney',
                      'warnerbrosdiscovery',
                      'nbcuniversal'
                  }
                  or media_pattern.search(r['name'])
              ]
          )

          # Artificial intelligence

          ai_pattern=re.compile(
              r'chat.?gpt|open.?ai|claude|anthropic|gemini|deep.?seek|grok|copilot|perplexity|midjourney|doubao|豆包|通义|通義|kimi|qwen|mistral|poe|sora',
              re.I
          )

          ai=[
              r for r in core
              if r['category'].casefold() in {
                  'ai',
                  'spacexai'
              }
              or ai_pattern.search(r['name'])
          ]

          core_all=core+emoji

          # ===================================
          # Generate all libraries
          # ===================================

          plans=[
              ('All.json','全部图标',core_all+auto),
              ('Flags.json','全球地区',flags),
              ('Streaming.json','流媒体与音乐',media),
              ('AI.json','人工智能',ai),
              ('Packs/Apple-Emoji.json','Apple Color Emoji',emoji),
              ('Packs/Apple-Flags.json','Apple 地区旗帜',apple_flags),
              ('Packs/Apple-iOS.json','Apple App Store',ios+auto)
          ]

          plans.extend(
              ('Packs/'+s+'.json',s,data[s])
              for s,_ in SOURCES
          )

          # Abnormal change detection

          def changes(file,icons):

              if not icons or len(icons)>MAX_TOTAL:
                  raise ValueError('Invalid output size: '+file)

              old=read(file)

              if old is None:

                  if file=='All.json':
                      raise ValueError('Missing previous main index')

                  return

              old_urls={
                  unquote(r['url'])
                  for r in old['icons']
              }

              new_urls={
                  unquote(r['url'])
                  for r in icons
              }

              if file in {
                  'All.json',
                  'Packs/Apple-iOS.json'
              }:

                  old_urls-={
                      unquote(r['url'])
                      for r in old_archive.values()
                  }

                  base_rows=(
                      core_all
                      if file=='All.json'
                      else ios
                  )

                  new_urls={
                      unquote(r['url'])
                      for r in pack(base_rows)
                  }

              if (
                  len(old_urls-new_urls)>max(
                      10,
                      math.ceil(len(old_urls)*.25)
                  )
                  or len(new_urls-old_urls)>max(
                      20,
                      math.ceil(len(old_urls)*.50)
                  )
              ):

                  raise ValueError(
                      'SECURITY BLOCK: abnormal core change in '+file
                  )

          prepared={}

          for file,title,rows in plans:

              icons=pack(rows)

              changes(file,icons)

              prepared[file]={
                  'name':'AllanRita · '+title,
                  'description':'Original external image URLs; rights remain with their owners.',
                  'icons':icons
              }

          prepared['Apple-Catalog.json']={
              'apps':archive,
              'next_chart':next_chart
          }

          # ===================================
          # Generate README
          # ===================================

          lines=[
              '# AllanRita Icon Library',
              '',
              'Version: V'+VERSION,
              '',
              'External icon links only. No image mirroring.',
              '',
              '| Index | Icons | Link |',
              '|---|---:|---|'
          ]

          for file,obj in prepared.items():

              if 'icons' in obj:

                  lines.append(
                      f'| {file} | {len(obj["icons"])} | [JSON]({BASE+file}) |'
                  )

          lines+=[
              '',
              '## Sources',
              ''
          ]

          lines+=[
              f'- [{s}]({u})'
              for s,u in SOURCES+EXTRA
          ]

          lines+=[
              '- [Apple RSS](https://rss.marketingtools.apple.com/)',
              '- [Apple Search API](https://developer.apple.com/library/archive/documentation/AudioVideo/Conceptual/iTuneSearchAPI/)',
              '- [Apple Emoji](https://github.com/iamcal/emoji-data)',
              '- [Custom.json](Custom.json)',
              '',
              'Apple charts are not a complete App Store catalog. Image contents are not virus-scanned.'
          ]

          # ===================================
          # Security and update report
          # ===================================

          report=[
              '## V'+VERSION,
              '',
              f'Chart feeds succeeded: {len(successes)} / {len(REGIONS)*len(CHARTS)}',
              f'Archived chart app IDs: {len(archive)}',
              f'New chart IDs: {len(set(archive)-set(old_archive))}',
              f'Charts attempted: {attempted}; failed: {attempted-len(successes)}; not attempted: {len(queue)-attempted}',
              f'Fixed-app fallback: {", ".join(lookup_warnings) or "none"}',
              f'All icons: {len(prepared["All.json"]["icons"])}',
              '',
              '### Failed feeds'
          ]+[
              '- '+x
              for x in failures
          ]

          encoded={
              file:(
                  json.dumps(
                      obj,
                      ensure_ascii=False,
                      indent=2
                  )+'\n'
              ).encode('utf-8')
              for file,obj in prepared.items()
          }

          encoded['README.md']=(
              '\n'.join(lines)+'\n'
          ).encode('utf-8')

          if any(
              len(b)>MAX_OUTPUT
              for b in encoded.values()
          ):

              raise ValueError(
                  'Output exceeds 50 MiB; prior library retained'
              )

          for file,blob in encoded.items():

              path=safe_path(file)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_bytes(blob)

          if os.environ.get('GITHUB_STEP_SUMMARY'):

              with open(
                  os.environ['GITHUB_STEP_SUMMARY'],
                  'a',
                  encoding='utf-8'
              ) as f:

                  f.write(
                      '\n'.join(report)+'\n'
                  )

          print(
              '\n'.join(report[:8])
          )

          PY

      - name: Commit validated indexes only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          import subprocess

          files=[
              'Icon/'+x
              for x in (
                  'All.json',
                  'Flags.json',
                  'Streaming.json',
                  'AI.json',
                  'README.md',
                  'Apple-Catalog.json'
              )
          ]

          packs=[
              'Apple-Emoji',
              'Apple-Flags',
              'Apple-iOS',
              'Qure-Color',
              'Qure-Mini',
              'Qure-Light',
              'Orz3-Color',
              'Orz3-Alpha',
              'Orz3-Mini',
              'Orz3-ColorPlus',
              'Orz3-MiniPlus',
              'Lige',
              'Semporia',
              'Oasisic',
              'KeLee',
              'fmz200',
              'KeLee-Flags'
          ]

          files+=[
              'Icon/Packs/'+p+'.json'
              for p in packs
          ]

          subprocess.check_call([
              'git',
              'add',
              '--',
              *files
          ])

          staged={
              p.decode()
              for p in subprocess.check_output([
                  'git',
                  'diff',
                  '--cached',
                  '--name-only',
                  '-z'
              ]).split(b'\0')
              if p
          }

          if not staged.issubset(files):
              raise SystemExit('Unexpected staged files')

          PY

          if git diff --cached --quiet; then

            echo 'No changes'

          else

            git commit -m 'Update Surge icon library V3.3 Apple Auto'

            auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)

            echo "::add-mask::$auth"

            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main

          fi

      - name: Failure notice
        if: failure()
        run: echo 'Icon update failed; review the logs. No partial index is committed by the build step.' >> "$GITHUB_STEP_SUMMARY"

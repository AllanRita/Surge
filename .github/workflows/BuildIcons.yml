
name: Build Icon Library

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: build-icon-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Merge icon indexes
        run: |
          python3 - <<'PY'
          import json, re, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit, unquote

          RAW = 'https://raw.githubusercontent.com/'

          SOURCES = [
              ('Qure-Color', RAW+'Koolson/Qure/master/Other/QureColor.json'),
              ('Qure-Mini', RAW+'Koolson/Qure/master/Other/Quremini.json'),
              ('Qure-Light', RAW+'Koolson/Qure/master/Other/QureLight-All.json'),
              ('Orz3-Color', RAW+'Orz-3/mini/master/miniColor.json'),
              ('Orz3-Alpha', RAW+'Orz-3/mini/master/miniAlpha.json'),
              ('Orz3-Mini', RAW+'Orz-3/mini/master/mini.json'),
              ('Orz3-ColorPlus', RAW+'Orz-3/mini/master/Color%2B.json'),
              ('Orz3-MiniPlus', RAW+'Orz-3/mini/master/mini%2B.json'),
              ('Lige', RAW+'lige47/lige_icon/main/ligeicon-surge.json'),
              ('Semporia', RAW+'Semporia/Hand-Painted-icon/master/Semporia.json'),
              ('Oasisic', RAW+'Hawaiine/Oasisic-Icons/main/config/surge-icon.json'),
              ('KeLee', RAW+'luestr/IconResource/main/KeLee_icon.json'),
              ('fmz200', RAW+'fmz200/wool_scripts/main/icons/icons-all.json'),
              ('KeLee-Flags', 'https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/ColorfulStaticFlag.json'),
          ]

          EXTRA = [
              ('Qure-Area', RAW+'Koolson/Qure/master/Other/QureColor-Area.json'),
              ('Qure-Media', RAW+'Koolson/Qure/master/Other/QureColor-Media.json'),
          ]

          def fetch(url):
              for attempt in range(3):
                  try:
                      req = Request(
                          url,
                          headers={
                              'User-Agent': 'AllanRita-IconIndex/1.0',
                              'Accept': 'application/json,*/*'
                          }
                      )

                      with urlopen(req, timeout=45) as response:
                          data = json.load(response)

                      rows = data['icons']

                      if not isinstance(rows, list) or not rows:
                          raise ValueError('Empty or invalid icon list')

                      return rows

                  except Exception:
                      if attempt == 2:
                          raise

                      time.sleep(2 ** attempt)

          def clean(source, rows):
              result = []

              for row in rows:

                  if not isinstance(row, dict):
                      continue

                  name = str(row.get('name') or '').strip()
                  url = str(row.get('url') or '').strip()

                  if not name or urlsplit(url).scheme != 'https' or not urlsplit(url).netloc:
                      continue

                  name = re.sub(
                      r'\.(png|jpe?g|webp|svg|gif)$',
                      '',
                      name,
                      flags=re.I
                  )

                  result.append({
                      'name': name,
                      'url': url,
                      'source': source,
                      'category': str(row.get('category') or '')
                  })

              if not result:
                  raise ValueError('No valid icons: '+source)

              return result

          def pack(rows):

              result = []
              seen = set()
              names = set()

              for row in rows:

                  url = row['url']
                  key = unquote(url)

                  if key in seen:
                      continue

                  seen.add(key)

                  base = row['name']+' · '+row['source']
                  name, i = base, 2

                  while name.casefold() in names:
                      name = base+' '+str(i)
                      i += 1

                  names.add(name.casefold())

                  result.append({
                      'name': name,
                      'url': url
                  })

              return sorted(
                  result,
                  key=lambda r: (
                      r['name'].casefold(),
                      r['url']
                  )
              )

          def write_pack(file, title, rows):

              icons = pack(rows)

              if not icons:
                  raise ValueError('Empty output: '+file)

              out = {
                  'name': 'AllanRita · '+title,
                  'description': 'Original upstream image URLs and source credits retained.',
                  'icons': icons
              }

              path = Path('Icon') / file

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      out,
                      ensure_ascii=False,
                      indent=2
                  )+'\n',
                  encoding='utf-8'
              )

              print(file, len(icons))

              return len(icons)

          # Download original icon libraries

          data = {
              s: clean(s, fetch(u))
              for s,u in SOURCES+EXTRA
          }

          all_rows = [
              r
              for s,_ in SOURCES+EXTRA
              for r in data[s]
          ]

          # Personal custom icons
          # Custom.json will not be overwritten

          custom_path = Path('Icon/Custom.json')

          if custom_path.exists():

              custom = json.loads(
                  custom_path.read_text(
                      encoding='utf-8'
                  )
              )

              custom_rows = custom['icons']

              if not isinstance(custom_rows, list):
                  raise ValueError(
                      'Custom.json icons must be a list'
                  )

              if custom_rows:
                  all_rows = clean(
                      'Custom',
                      custom_rows
                  ) + all_rows

          # Global country and region flags

          flags = (
              data['KeLee-Flags']
              + data['Qure-Area']
              + [
                  r for r in all_rows
                  if r['category'].casefold() in {
                      'country',
                      'region',
                      'flag',
                      'flags'
                  }
              ]
          )

          # Streaming and music

          streaming = re.compile(
              r'youtube|netflix|disney|hbo|\bmax\b|hulu|prime.?video|amazon.?video|spotify|paramount|\bviu\b|abema|u.?next|bahamut|baha|巴哈|动画疯|動畫瘋|emby|plex|tver|peacock|dazn|bilibili|twitch|crunchyroll|apple.?tv|\badn\b|animation.?digital.?network|kktv|iqiyi|wetv',
              re.I
          )

          media = (
              data['Qure-Media']
              + [
                  r for r in all_rows
                  if r['category'].casefold() in {
                      'media',
                      'music',
                      'streaming',
                      'disney',
                      'warnerbrosdiscovery',
                      'nbcuniversal'
                  }
                  or streaming.search(r['name'])
              ]
          )

          # Artificial Intelligence

          ai = re.compile(
              r'chat.?gpt|open.?ai|claude|anthropic|gemini|deep.?seek|grok|copilot|perplexity|midjourney|doubao|豆包|通义|通義|kimi|qwen|mistral|poe|sora',
              re.I
          )

          ai_rows = [
              r for r in all_rows
              if r['category'].casefold() in {
                  'ai',
                  'spacexai'
              }
              or ai.search(r['name'])
          ]

          # ==================================
          # Apple Color Emoji
          # ==================================

          APPLE = 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@16.0.0/'

          req = Request(
              APPLE+'emoji.json',
              headers={
                  'User-Agent': 'AllanRita-IconIndex/3.0'
              }
          )

          with urlopen(req, timeout=60) as response:
              emoji_data = json.load(response)

          apple = []

          for e in emoji_data:

              if not isinstance(e, dict) or e.get('obsoleted_by'):
                  continue

              name = (
                  e.get('name')
                  or e.get('short_name')
                  or e.get('unified')
                  or 'Emoji'
              )

              code = e.get('unified') or ''

              parts = code.split('-')

              region = ''

              # Regional indicator emoji

              if len(parts) == 2 and all(
                  re.fullmatch(
                      r'1F1[E-F][0-9A-F]',
                      p,
                      re.I
                  )
                  and 0x1F1E6 <= int(p,16) <= 0x1F1FF
                  for p in parts
              ):

                  region = ''.join(
                      chr(int(p,16)-0x1F1E6+65)
                      for p in parts
                  )

              category = (
                  'Country'
                  if region or e.get('subcategory') in {
                      'country-flag',
                      'subdivision-flag'
                  }
                  else 'Emoji'
              )

              if region:
                  name = region+' · '+name

              variants = [(e, name)]

              variants += [
                  (v, name+' · '+k)
                  for k,v in (
                      e.get('skin_variations') or {}
                  ).items()
              ]

              for v, label in variants:

                  image = v.get('image') or ''

                  if (
                      v.get('has_img_apple') is True
                      and re.fullmatch(
                          r'[0-9a-f-]+\.png',
                          image,
                          re.I
                      )
                  ):

                      apple.append({
                          'name': label,
                          'url': APPLE+'img/apple/64/'+image,
                          'category': category
                      })

          apple = clean(
              'Apple Emoji',
              apple
          )

          apple_flags = [
              r for r in apple
              if r['category'] == 'Country'
          ]

          # Prevent incomplete updates

          if len(apple) < 1000 or len(apple_flags) < 200:
              raise ValueError(
                  'Apple Emoji index incomplete'
              )

          # Merge Apple icons into existing libraries

          all_rows.extend(apple)

          flags.extend(apple_flags)

          # ==================================
          # Generate Apple icon packs
          # ==================================

          outputs = {

              'Packs/Apple-Emoji.json': write_pack(
                  'Packs/Apple-Emoji.json',
                  'Apple Color Emoji',
                  apple
              ),

              'Packs/Apple-Flags.json': write_pack(
                  'Packs/Apple-Flags.json',
                  'Apple 地区旗帜',
                  apple_flags
              )

          }

          # ==================================
          # Generate combined icon libraries
          # ==================================

          for file,title,rows in [

              ('All.json','全部图标',all_rows),

              ('Flags.json','全球地区',flags),

              ('Streaming.json','流媒体与音乐',media),

              ('AI.json','人工智能',ai_rows),

          ]:

              outputs[file] = write_pack(
                  file,
                  title,
                  rows
              )

          # Generate individual style packs

          for source,_ in SOURCES:

              file = 'Packs/'+source+'.json'

              outputs[file] = write_pack(
                  file,
                  source,
                  data[source]
              )

          # ==================================
          # Generate README
          # ==================================

          base = 'https://raw.githubusercontent.com/AllanRita/Surge/main/Icon/'

          lines = [

              '# AllanRita Icon Library',

              '',

              'Surge 图标索引聚合；图片归原作者及相关权利人所有。未镜像图片。',

              '',

              '## 订阅',

              '',

              '| 图标库 | 数量 | 地址 |',

              '|---|---:|---|'

          ]

          for file,count in outputs.items():

              lines.append(
                  f'| {file} | {count} | [JSON]({base+file}) |'
              )

          lines += [

              '',

              '## 上游来源',

              ''

          ]

          for source,url in SOURCES+EXTRA:

              lines.append(
                  f'- [{source}]({url})'
              )

          lines.append(
              '- [Custom.json](Custom.json) — 个人补充图标及来源'
          )

          lines.append(
              '- [Apple Color Emoji](https://github.com/iamcal/emoji-data) — Apple Inc. 图像版权；外部链接，非商业用途。固定 Emoji 16.0 数据源。'
          )

          lines += [

              '',

              '按图片链接去重；保留不同风格。分类由上游分类及关键词辅助整理，可能有遗漏。图片可用性依赖原作者服务器。',

              ''

          ]

          Path('Icon/README.md').write_text(
              '\n'.join(lines),
              encoding='utf-8'
          )

          PY

      - name: Commit indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add Icon/

          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update Surge icon library V3.0'
            git push origin HEAD:main
          fi

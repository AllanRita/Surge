
name: Build Icon Library

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: build-icon-library
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Secure checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Secure icon index build
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          import os
          import math

          from pathlib import Path
          from urllib.request import (
              Request,
              build_opener,
              HTTPRedirectHandler
          )
          from urllib.parse import urlsplit, unquote

          VERSION = '3.1 Security'

          RAW = 'https://raw.githubusercontent.com/'
          APPLE = 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@16.0.0/'

          MAX_BYTES = 12 * 1024 * 1024
          MAX_ICONS = 30000

          SOURCES = [
              ('Qure-Color', RAW+'Koolson/Qure/master/Other/QureColor.json'),
              ('Qure-Mini', RAW+'Koolson/Qure/master/Other/Quremini.json'),
              ('Qure-Light', RAW+'Koolson/Qure/master/Other/QureLight-All.json'),
              ('Orz3-Color', RAW+'Orz-3/mini/master/miniColor.json'),
              ('Orz3-Alpha', RAW+'Orz-3/mini/master/miniAlpha.json'),
              ('Orz3-Mini', RAW+'Orz-3/mini/master/mini.json'),
              ('Orz3-ColorPlus', RAW+'Orz-3/mini/master/Color%2B.json'),
              ('Orz3-MiniPlus', RAW+'Orz-3/mini/master/mini%2B.json'),
              ('Lige', RAW+'lige47/lige_icon/main/ligeicon-surge.json'),
              ('Semporia', RAW+'Semporia/Hand-Painted-icon/master/Semporia.json'),
              ('Oasisic', RAW+'Hawaiine/Oasisic-Icons/main/config/surge-icon.json'),
              ('KeLee', RAW+'luestr/IconResource/main/KeLee_icon.json'),
              ('fmz200', RAW+'fmz200/wool_scripts/main/icons/icons-all.json'),
              ('KeLee-Flags', 'https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/ColorfulStaticFlag.json'),
          ]

          EXTRA = [
              ('Qure-Area', RAW+'Koolson/Qure/master/Other/QureColor-Area.json'),
              ('Qure-Media', RAW+'Koolson/Qure/master/Other/QureColor-Media.json'),
          ]

          # ========================================
          # Security 1: Trusted image source paths
          # ========================================

          TRUSTED = {

              'Qure': [
                  RAW+'Koolson/Qure/master/IconSet/',
              ],

              'Orz3': [
                  RAW+'Orz-3/mini/master/Color/',
                  RAW+'Orz-3/mini/master/Alpha/',
              ],

              'Lige': [
                  RAW+'lige47/QuanX-icon-rule/main/icon/',
              ],

              'Semporia': [
                  RAW+'Semporia/Hand-Painted-icon/master/Rounded_Rectangle/',
                  RAW+'Semporia/Hand-Painted-icon/master/Google_Suite/',
                  RAW+'Semporia/Hand-Painted-icon/master/Social_Media/',
                  RAW+'Semporia/Hand-Painted-icon/master/Universal/',
              ],

              'Oasisic': [
                  RAW+'Hawaiine/Oasisic-Icons/main/icons/',
              ],

              'KeLee': [
                  RAW+'luestr/IconResource/main/App_icon/',
                  RAW+'luestr/IconResource/main/Other_icon/',
                  RAW+'luestr/IconResource/main/Website_icon/',
              ],

              'KeLee-Flags': [
                  'https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/',
              ],

              'fmz200': [
                  RAW+'fmz200/wool_scripts/main/icons/',
              ],

              'Apple Emoji': [
                  APPLE+'img/apple/64/',
              ],

              'Personal': [
                  'https://cdn.jsdelivr.net/gh/selfhst/icons/png/',
                  'https://www.emojiall.com/images/240/apple/',
              ],

          }

          TRUSTED_DOMAINS = {
              'raw.githubusercontent.com',
              'cdn.jsdelivr.net',
              'gitlab.com',
              'play-lh.googleusercontent.com',
              'www.emojiall.com',
          }

          def valid_url(source, url):

              if not isinstance(url, str):
                  return False

              if len(url) > 2048:
                  return False

              if any(ord(c) <= 32 or ord(c) == 127 for c in url):
                  return False

              try:
                  p = urlsplit(url)
              except ValueError:
                  return False

              if p.scheme != 'https':
                  return False

              if p.netloc not in TRUSTED_DOMAINS:
                  return False

              if p.query or p.fragment:
                  return False

              if re.search(r'%(2f|5c|00|25)', url, re.I):
                  return False

              path = unquote(p.path)

              if re.search(r'[\x00-\x1f\x7f\\?#]', path):
                  return False

              if any(part in {'.', '..'} for part in path.split('/')):
                  return False

              normalized = 'https://'+p.netloc+path

              if p.netloc == 'play-lh.googleusercontent.com':

                  return (
                      source == 'Custom'
                      and re.fullmatch(
                          r'/[A-Za-z0-9_-]+(?:=w\d+-h\d+)?',
                          path
                      ) is not None
                  )

              if not re.search(
                  r'\.(png|jpg|jpeg)$',
                  path,
                  re.I
              ):
                  return False

              if source == 'Custom':

                  prefixes = [
                      prefix
                      for group in TRUSTED.values()
                      for prefix in group
                  ]

              else:

                  family = source

                  if source.startswith('Qure-'):
                      family = 'Qure'

                  elif source.startswith('Orz3-'):
                      family = 'Orz3'

                  prefixes = TRUSTED.get(family, [])

              return any(
                  normalized.startswith(prefix)
                  for prefix in prefixes
              )

          # ========================================
          # Security 2: Block external redirects
          # ========================================

          class NoRedirect(HTTPRedirectHandler):

              def redirect_request(
                  self, req, fp, code, msg, headers, newurl
              ):
                  return None

          OPENER = build_opener(NoRedirect())

          INDEX_URLS = {
              u for _, u in SOURCES + EXTRA
          }

          INDEX_URLS.add(APPLE+'emoji.json')

          def fetch_json(url):

              if url not in INDEX_URLS:
                  raise ValueError('Unapproved index source')

              for attempt in range(3):

                  try:

                      req = Request(
                          url,
                          headers={
                              'User-Agent': 'AllanRita-IconIndex/3.1',
                              'Accept': 'application/json,*/*'
                          }
                      )

                      with OPENER.open(req, timeout=45) as response:

                          if response.geturl() != url:
                              raise ValueError('Unexpected redirect')

                          raw = response.read(MAX_BYTES+1)

                      if len(raw) > MAX_BYTES:
                          raise ValueError('Index exceeds size limit')

                      return json.loads(raw)

                  except Exception:

                      if attempt == 2:
                          raise RuntimeError(
                              'Trusted index download or validation failed'
                          ) from None

                      time.sleep(2 ** attempt)

          # ========================================
          # Security 3: Validate names and records
          # ========================================

          def clean(source, rows):

              if not isinstance(rows, list):
                  raise ValueError('Invalid icon list: '+source)

              if len(rows) > MAX_ICONS:
                  raise ValueError('Too many records: '+source)

              result = []
              rejected = 0

              for row in rows:

                  if not isinstance(row, dict):
                      rejected += 1
                      continue

                  name = row.get('name')
                  url = row.get('url')

                  if not isinstance(name, str):
                      rejected += 1
                      continue

                  if not isinstance(url, str):
                      rejected += 1
                      continue

                  name = name.strip()
                  url = url.strip()

                  if (
                      not name
                      or len(name) > 240
                      or re.search(r'[\x00-\x1f\x7f]', name)
                      or not valid_url(source, url)
                  ):
                      rejected += 1
                      continue

                  name = re.sub(
                      r'\.(png|jpg|jpeg|webp|svg|gif)$',
                      '',
                      name,
                      flags=re.I
                  )

                  result.append({
                      'name': name,
                      'url': url,
                      'source': source,
                      'category': str(row.get('category') or '')
                  })

              if rejected:

                  raise ValueError(
                      f'SECURITY BLOCK: {source}: '
                      f'{rejected} invalid records'
                  )

              if not result and source != 'Custom':
                  raise ValueError('Empty source: '+source)

              print(
                  f'SECURITY PASS: {source}: '
                  f'{len(result)} records'
              )

              return result

          def pack(rows):

              result = []
              seen = set()
              names = set()

              for row in rows:

                  url = row['url']
                  key = unquote(url)

                  if key in seen:
                      continue

                  seen.add(key)

                  base = row['name']+' · '+row['source']

                  name = base
                  i = 2

                  while name.casefold() in names:
                      name = base+' '+str(i)
                      i += 1

                  names.add(name.casefold())

                  result.append({
                      'name': name,
                      'url': url
                  })

              return sorted(
                  result,
                  key=lambda r: (
                      r['name'].casefold(),
                      r['url']
                  )
              )

          # ========================================
          # Download trusted original icon indexes
          # ========================================

          data = {}

          for source, url in SOURCES + EXTRA:

              downloaded = fetch_json(url)

              if not isinstance(downloaded, dict):
                  raise ValueError('Invalid index: '+source)

              data[source] = clean(
                  source,
                  downloaded.get('icons')
              )

          all_rows = [
              r
              for source, _ in SOURCES + EXTRA
              for r in data[source]
          ]

          # ========================================
          # Preserve personal custom icons
          # ========================================

          custom_path = Path('Icon/Custom.json')

          if custom_path.is_symlink():
              raise ValueError('Unsafe Custom.json path')

          if custom_path.exists():

              if custom_path.stat().st_size > MAX_BYTES:
                  raise ValueError('Custom.json too large')

              custom = json.loads(
                  custom_path.read_text(encoding='utf-8')
              )

              custom_icons = clean(
                  'Custom',
                  custom['icons']
              )

              all_rows = custom_icons + all_rows

          # ========================================
          # Country and region flags
          # ========================================

          flags = (
              data['KeLee-Flags']
              + data['Qure-Area']
              + [
                  r for r in all_rows
                  if r['category'].casefold() in {
                      'country',
                      'region',
                      'flag',
                      'flags'
                  }
              ]
          )

          # ========================================
          # Streaming and music
          # ========================================

          streaming = re.compile(
              r'youtube|netflix|disney|hbo|\bmax\b|hulu|prime.?video|amazon.?video|spotify|paramount|\bviu\b|abema|u.?next|bahamut|baha|巴哈|动画疯|動畫瘋|emby|plex|tver|peacock|dazn|bilibili|twitch|crunchyroll|apple.?tv|\badn\b|animation.?digital.?network|kktv|iqiyi|wetv|fox.?one|rakuten.?viki|sling|starz|fubo|espn|discovery',
              re.I
          )

          media = (
              data['Qure-Media']
              + [
                  r for r in all_rows
                  if r['category'].casefold() in {
                      'media',
                      'music',
                      'streaming',
                      'disney',
                      'warnerbrosdiscovery',
                      'nbcuniversal'
                  }
                  or streaming.search(r['name'])
              ]
          )

          # ========================================
          # Artificial intelligence
          # ========================================

          ai = re.compile(
              r'chat.?gpt|open.?ai|claude|anthropic|gemini|deep.?seek|grok|copilot|perplexity|midjourney|doubao|豆包|通义|通義|kimi|qwen|mistral|poe|sora',
              re.I
          )

          ai_rows = [
              r for r in all_rows
              if r['category'].casefold() in {
                  'ai',
                  'spacexai'
              }
              or ai.search(r['name'])
          ]

          # ========================================
          # Apple Color Emoji
          # Fixed upstream version: 16.0.0
          # ========================================

          emoji_data = fetch_json(
              APPLE+'emoji.json'
          )

          if not isinstance(emoji_data, list):
              raise ValueError('Invalid Apple index')

          apple = []

          for e in emoji_data:

              if not isinstance(e, dict) or e.get('obsoleted_by'):
                  continue

              name = (
                  e.get('name')
                  or e.get('short_name')
                  or e.get('unified')
                  or 'Emoji'
              )

              code = e.get('unified') or ''
              parts = code.split('-')

              region = ''

              if len(parts) == 2 and all(

                  re.fullmatch(
                      r'1F1[E-F][0-9A-F]',
                      p,
                      re.I
                  )

                  and 0x1F1E6 <= int(p,16) <= 0x1F1FF

                  for p in parts

              ):

                  region = ''.join(
                      chr(int(p,16)-0x1F1E6+65)
                      for p in parts
                  )

              category = (
                  'Country'
                  if region or e.get('subcategory') in {
                      'country-flag',
                      'subdivision-flag'
                  }
                  else 'Emoji'
              )

              if region:
                  name = region+' · '+name

              variants = [(e, name)]

              variants += [
                  (v, name+' · '+k)
                  for k,v in (
                      e.get('skin_variations') or {}
                  ).items()
              ]

              for v, label in variants:

                  image = v.get('image') or ''

                  if (
                      v.get('has_img_apple') is True
                      and re.fullmatch(
                          r'[0-9a-f-]+\.png',
                          image,
                          re.I
                      )
                  ):

                      apple.append({
                          'name': label,
                          'url': APPLE+'img/apple/64/'+image,
                          'category': category
                      })

          apple = clean(
              'Apple Emoji',
              apple
          )

          apple_flags = [
              r for r in apple
              if r['category'] == 'Country'
          ]

          if len(apple) < 1000:
              raise ValueError('Apple Emoji index incomplete')

          if len(apple_flags) < 200:
              raise ValueError('Apple flag index incomplete')

          all_rows.extend(apple)
          flags.extend(apple_flags)

          # ========================================
          # Prepare all output indexes
          # ========================================

          plans = [
              ('All.json','全部图标',all_rows),
              ('Flags.json','全球地区',flags),
              ('Streaming.json','流媒体与音乐',media),
              ('AI.json','人工智能',ai_rows),
              ('Packs/Apple-Emoji.json','Apple Color Emoji',apple),
              ('Packs/Apple-Flags.json','Apple 地区旗帜',apple_flags),
          ]

          for source, _ in SOURCES:

              plans.append((
                  'Packs/'+source+'.json',
                  source,
                  data[source]
              ))

          # ========================================
          # Security 4: Protect output file paths
          # ========================================

          def safe_path(file):

              path = Path('Icon') / file

              for p in [path, *path.parents]:

                  if p.is_symlink():
                      raise ValueError('Unsafe output path')

              return path

          # ========================================
          # Security 5: Detect abnormal updates
          # ========================================

          def check_changes(file, icons):

              path = safe_path(file)

              if not icons:
                  raise ValueError('Empty output: '+file)

              if len(icons) > MAX_ICONS:
                  raise ValueError('Output too large: '+file)

              if not path.exists():

                  if file == 'All.json':
                      raise ValueError('Previous main index missing')

                  return

              if path.stat().st_size > MAX_BYTES:
                  raise ValueError('Previous index too large')

              previous = json.loads(
                  path.read_text(encoding='utf-8')
              )['icons']

              old_urls = {
                  unquote(i['url'])
                  for i in previous
              }

              new_urls = {
                  unquote(i['url'])
                  for i in icons
              }

              removed = len(old_urls - new_urls)
              added = len(new_urls - old_urls)

              removal_limit = max(
                  10,
                  math.ceil(len(old_urls)*0.25)
              )

              addition_limit = max(
                  20,
                  math.ceil(len(old_urls)*0.50)
              )

              if removed > removal_limit:

                  raise ValueError(
                      f'SECURITY BLOCK: {file}: '
                      f'{removed} removed icons'
                  )

              if added > addition_limit:

                  raise ValueError(
                      f'SECURITY BLOCK: {file}: '
                      f'{added} new icons'
                  )

              print(
                  f'CHANGE CHECK: {file}: '
                  f'+{added} / -{removed}'
              )

          # Validate every output before writing

          prepared = {}

          for file, title, rows in plans:

              icons = pack(rows)

              check_changes(file, icons)

              prepared[file] = {
                  'name': 'AllanRita · '+title,
                  'description': 'Original upstream image URLs and source credits retained.',
                  'icons': icons
              }

          # ========================================
          # Write validated JSON indexes
          # ========================================

          outputs = {}

          for file, content in prepared.items():

              path = safe_path(file)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_text(
                  json.dumps(
                      content,
                      ensure_ascii=False,
                      indent=2
                  )+'\n',
                  encoding='utf-8'
              )

              outputs[file] = len(content['icons'])

              print(
                  file,
                  outputs[file]
              )

          # ========================================
          # Generate README
          # ========================================

          base = 'https://raw.githubusercontent.com/AllanRita/Surge/main/Icon/'

          lines = [

              '# AllanRita Icon Library',

              '',

              'Version: V3.1 Security',

              '',

              'Surge 图标索引聚合。仅引用外部图片，版权归原权利人所有。',

              '',

              '## 订阅',

              '',

              '| 图标库 | 数量 | 地址 |',

              '|---|---:|---|'

          ]

          for file, count in outputs.items():

              lines.append(
                  f'| {file} | {count} | [JSON]({base+file}) |'
              )

          lines += [

              '',

              '## 上游来源',

              ''

          ]

          for source, url in SOURCES + EXTRA:

              lines.append(
                  f'- [{source}]({url})'
              )

          lines += [

              '- [Custom.json](Custom.json)',

              '- [Apple Color Emoji](https://github.com/iamcal/emoji-data) — Emoji 16.0',

              '',

              '## 安全机制',

              '',

              '- HTTPS only',

              '- Trusted domain and repository paths',

              '- Image URL validation',

              '- External index redirects blocked',

              '- Input size limits',

              '- Abnormal update detection',

              '- Fixed GitHub Actions dependency',

              '- Restricted generated file staging',

              '',

              '安全检查仅针对索引及链接，不代表图片内容已经过病毒扫描。',

              ''

          ]

          safe_path('README.md').write_text(
              '\n'.join(lines),
              encoding='utf-8'
          )

          # ========================================
          # Security 6: Workflow security report
          # ========================================

          report = [

              '## Icon Library V3.1 Security',

              '',

              'All index security checks passed.',

              '',

              '| Index | Icons |',

              '|---|---:|'

          ]

          for file, count in outputs.items():

              report.append(
                  f'| {file} | {count} |'
              )

          report += [

              '',

              '- HTTPS validation: PASS',

              '- Trusted source paths: PASS',

              '- Image URL format: PASS',

              '- Record validation: PASS',

              '- Abnormal change detection: PASS',

              '',

              'Image binary contents were not scanned.'

          ]

          summary = os.environ.get(
              'GITHUB_STEP_SUMMARY'
          )

          if summary:

              with open(
                  summary,
                  'a',
                  encoding='utf-8'
              ) as f:

                  f.write('\n'.join(report)+'\n')

          print(
              'SECURITY VALIDATION PASSED'
          )

          PY

      - name: Secure commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            Icon/All.json \
            Icon/Flags.json \
            Icon/Streaming.json \
            Icon/AI.json \
            Icon/README.md \
            Icon/Packs/Apple-Emoji.json \
            Icon/Packs/Apple-Flags.json \
            Icon/Packs/Qure-Color.json \
            Icon/Packs/Qure-Mini.json \
            Icon/Packs/Qure-Light.json \
            Icon/Packs/Orz3-Color.json \
            Icon/Packs/Orz3-Alpha.json \
            Icon/Packs/Orz3-Mini.json \
            Icon/Packs/Orz3-ColorPlus.json \
            Icon/Packs/Orz3-MiniPlus.json \
            Icon/Packs/Lige.json \
            Icon/Packs/Semporia.json \
            Icon/Packs/Oasisic.json \
            Icon/Packs/KeLee.json \
            Icon/Packs/fmz200.json \
            Icon/Packs/KeLee-Flags.json

          python3 - <<'PY'
          import subprocess

          allowed = {
              'Icon/All.json',
              'Icon/Flags.json',
              'Icon/Streaming.json',
              'Icon/AI.json',
              'Icon/README.md',
          }

          packs = [
              'Apple-Emoji',
              'Apple-Flags',
              'Qure-Color',
              'Qure-Mini',
              'Qure-Light',
              'Orz3-Color',
              'Orz3-Alpha',
              'Orz3-Mini',
              'Orz3-ColorPlus',
              'Orz3-MiniPlus',
              'Lige',
              'Semporia',
              'Oasisic',
              'KeLee',
              'fmz200',
              'KeLee-Flags',
          ]

          allowed.update(
              'Icon/Packs/'+p+'.json'
              for p in packs
          )

          raw = subprocess.check_output([
              'git',
              'diff',
              '--cached',
              '--name-only',
              '-z'
          ])

          staged = {
              p.decode('utf-8')
              for p in raw.split(b'\0')
              if p
          }

          if not staged.issubset(allowed):

              raise SystemExit(
                  'SECURITY BLOCK: unexpected staged files'
              )

          print('Staged file security check: PASS')

          PY

          if git diff --cached --quiet; then

            echo 'No changes'

          else

            git commit -m 'Update Surge icon library V3.1 Security'

            auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)

            echo "::add-mask::$auth"

            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main

          fi

      - name: Security failure notice
        if: failure()
        run: |
          echo "## Security check failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The icon update did not complete successfully. Review the logs before retrying." >> "$GITHUB_STEP_SUMMARY"

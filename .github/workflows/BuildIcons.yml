
name: Build Icon Library

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: build-icon-library
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Secure checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Build secure icon indexes
        run: |
          python3 - <<'PY'
          import json, re, time, os, math
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urlsplit, unquote

          VERSION = '3.2.1 Security + iOS Custom'
          RAW = 'https://raw.githubusercontent.com/'
          APPLE = 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@16.0.0/'
          BASE = RAW+'AllanRita/Surge/main/Icon/'
          MAX_BYTES = 12*1024*1024
          MAX_ICONS = 30000
          MAX_APPS = 100

          SOURCES = [
              ('Qure-Color', RAW+'Koolson/Qure/master/Other/QureColor.json'),
              ('Qure-Mini', RAW+'Koolson/Qure/master/Other/Quremini.json'),
              ('Qure-Light', RAW+'Koolson/Qure/master/Other/QureLight-All.json'),
              ('Orz3-Color', RAW+'Orz-3/mini/master/miniColor.json'),
              ('Orz3-Alpha', RAW+'Orz-3/mini/master/miniAlpha.json'),
              ('Orz3-Mini', RAW+'Orz-3/mini/master/mini.json'),
              ('Orz3-ColorPlus', RAW+'Orz-3/mini/master/Color%2B.json'),
              ('Orz3-MiniPlus', RAW+'Orz-3/mini/master/mini%2B.json'),
              ('Lige', RAW+'lige47/lige_icon/main/ligeicon-surge.json'),
              ('Semporia', RAW+'Semporia/Hand-Painted-icon/master/Semporia.json'),
              ('Oasisic', RAW+'Hawaiine/Oasisic-Icons/main/config/surge-icon.json'),
              ('KeLee', RAW+'luestr/IconResource/main/KeLee_icon.json'),
              ('fmz200', RAW+'fmz200/wool_scripts/main/icons/icons-all.json'),
              ('KeLee-Flags', 'https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/ColorfulStaticFlag.json'),
          ]

          EXTRA = [
              ('Qure-Area', RAW+'Koolson/Qure/master/Other/QureColor-Area.json'),
              ('Qure-Media', RAW+'Koolson/Qure/master/Other/QureColor-Media.json'),
          ]

          # Trusted image sources

          TRUSTED = {
              'Qure': [
                  RAW+'Koolson/Qure/master/IconSet/'
              ],
              'Orz3': [
                  RAW+'Orz-3/mini/master/'+p+'/'
                  for p in ('Color','Alpha')
              ],
              'Lige': [
                  RAW+'lige47/QuanX-icon-rule/main/icon/'
              ],
              'Semporia': [
                  RAW+'Semporia/Hand-Painted-icon/master/'+p+'/'
                  for p in (
                      'Rounded_Rectangle',
                      'Google_Suite',
                      'Social_Media',
                      'Universal'
                  )
              ],
              'Oasisic': [
                  RAW+'Hawaiine/Oasisic-Icons/main/icons/'
              ],
              'KeLee': [
                  RAW+'luestr/IconResource/main/'+p+'/'
                  for p in (
                      'App_icon',
                      'Other_icon',
                      'Website_icon'
                  )
              ],
              'KeLee-Flags': [
                  'https://gitlab.com/lodepuly/iconlibrary/-/raw/main/Flag_icon/'
              ],
              'fmz200': [
                  RAW+'fmz200/wool_scripts/main/icons/'
              ],
              'Apple Emoji': [
                  APPLE+'img/apple/64/'
              ],
              'Personal': [
                  'https://cdn.jsdelivr.net/gh/selfhst/icons/png/',
                  'https://www.emojiall.com/images/240/apple/'
              ],
          }

          # Security: Validate image URLs

          def valid_url(source,url):

              if not isinstance(url,str):
                  return False

              if len(url)>2048:
                  return False

              if any(ord(c)<=32 or ord(c)==127 for c in url):
                  return False

              try:
                  p=urlsplit(url)
              except ValueError:
                  return False

              if p.scheme!='https' or p.query or p.fragment:
                  return False

              if re.search(r'%(2f|5c|00|25)',url,re.I):
                  return False

              path=unquote(p.path)

              if re.search(r'[\x00-\x1f\x7f\\?#]',path):
                  return False

              if any(x in {'.','..'} for x in path.split('/')):
                  return False

              # Apple App Store CDN

              if re.fullmatch(
                  r'is[1-5](?:-ssl)?\.mzstatic\.com',
                  p.netloc
              ):
                  return (
                      source in {'iOS','Custom'}
                      and path.startswith('/image/thumb/')
                      and bool(
                          re.search(
                              r'\.(png|jpe?g|webp)$',
                              path,
                              re.I
                          )
                      )
                  )

              if source=='iOS':
                  return False

              # Google Play CDN

              if p.netloc=='play-lh.googleusercontent.com':
                  return (
                      source=='Custom'
                      and bool(
                          re.fullmatch(
                              r'/[A-Za-z0-9_-]+(?:=w\d+-h\d+)?',
                              path
                          )
                      )
                  )

              if not re.search(r'\.(png|jpe?g)$',path,re.I):
                  return False

              family=(
                  'Qure' if source.startswith('Qure-')
                  else 'Orz3' if source.startswith('Orz3-')
                  else source
              )

              prefixes=(
                  [
                      x
                      for group in TRUSTED.values()
                      for x in group
                  ]
                  if source=='Custom'
                  else TRUSTED.get(family,[])
              )

              return any(
                  ('https://'+p.netloc+path).startswith(x)
                  for x in prefixes
              )

          def name_ok(name):
              return (
                  isinstance(name,str)
                  and bool(name.strip())
                  and len(name)<=240
                  and not re.search(
                      r'[\x00-\x1f\x7f]',
                      name
                  )
              )

          # Security: Validate records

          def clean(source,rows):

              if not isinstance(rows,list) or len(rows)>MAX_ICONS:
                  raise ValueError('Invalid icon list: '+source)

              out=[]

              for r in rows:

                  if (
                      not isinstance(r,dict)
                      or not name_ok(r.get('name'))
                      or not valid_url(source,r.get('url'))
                  ):
                      raise ValueError(
                          'SECURITY BLOCK: invalid record in '+source
                      )

                  out.append({
                      'name':re.sub(
                          r'\.(png|jpe?g|webp|svg|gif)$',
                          '',
                          r['name'].strip(),
                          flags=re.I
                      ),
                      'url':r['url'],
                      'source':source,
                      'category':str(r.get('category') or '')
                  })

              if not out and source not in {'Custom','iOS'}:
                  raise ValueError('Empty source: '+source)

              return out

          # Deduplicate image URLs

          def pack(rows):

              out=[]
              urls=set()
              names=set()

              for r in rows:

                  key=unquote(r['url'])

                  if key in urls:
                      continue

                  urls.add(key)

                  base=r['name']+' · '+r['source']
                  name=base
                  n=2

                  while name.casefold() in names:
                      name=base+' '+str(n)
                      n+=1

                  names.add(name.casefold())

                  out.append({
                      'name':name,
                      'url':r['url']
                  })

              return sorted(
                  out,
                  key=lambda r:(
                      r['name'].casefold(),
                      r['url']
                  )
              )

          # Security: Protect local paths

          def safe_path(file):

              p=Path('Icon')/file

              if any(
                  x.is_symlink()
                  for x in [p,*p.parents]
              ):
                  raise ValueError('Unsafe file path: '+file)

              return p

          def read(file,default=None):

              p=safe_path(file)

              if not p.exists():
                  return default

              if p.stat().st_size>MAX_BYTES:
                  raise ValueError('File too large: '+file)

              return json.loads(
                  p.read_text(encoding='utf-8')
              )

          # Personal icons and manually registered Apple apps

          custom=read('Custom.json')

          if (
              not isinstance(custom,dict)
              or not isinstance(custom.get('ios_apps'),list)
          ):
              raise ValueError(
                  'Custom.json must contain ios_apps; migrate it before running'
              )

          custom_icons=clean(
              'Custom',
              custom['icons']
          )

          apps=custom['ios_apps']

          if not 1<=len(apps)<=MAX_APPS:
              raise ValueError('Invalid iOS app count')

          keys=set()
          labels=set()

          for a in apps:

              if (
                  not isinstance(a,dict)
                  or not name_ok(a.get('name'))
                  or type(a.get('app_id')) is not int
                  or not 1<=a['app_id']<10**20
                  or not isinstance(a.get('country'),str)
                  or not re.fullmatch(
                      r'[a-z]{2}',
                      a['country']
                  )
              ):
                  raise ValueError('Invalid iOS app registration')

              if not name_ok(a.get('category')):
                  raise ValueError('Invalid app category')

              key=a['country']+':'+str(a['app_id'])
              label=a['name'].strip().casefold()

              if key in keys or label in labels:
                  raise ValueError('Duplicate iOS registration')

              keys.add(key)
              labels.add(label)

              if (
                  'fallback_url' in a
                  and not valid_url(
                      'iOS',
                      a['fallback_url']
                  )
              ):
                  raise ValueError('Invalid Apple fallback URL')

          def lookup(a):
              return (
                  'https://itunes.apple.com/lookup'
                  f"?id={a['app_id']}&country={a['country']}&entity=software"
              )

          allowed=(
              {u for _,u in SOURCES+EXTRA}
              | {APPLE+'emoji.json'}
              | {lookup(a) for a in apps}
          )

          # Security: Block external index redirects

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None

          opener=build_opener(NoRedirect())

          def fetch(url,attempts=3,timeout=35):

              if url not in allowed:
                  raise ValueError('Unapproved index URL')

              for i in range(attempts):

                  try:

                      req=Request(
                          url,
                          headers={
                              'User-Agent':'AllanRita-IconIndex/3.2.1',
                              'Accept':'application/json,*/*'
                          }
                      )

                      with opener.open(
                          req,
                          timeout=timeout
                      ) as res:

                          if res.geturl()!=url:
                              raise ValueError('Redirect blocked')

                          raw=res.read(MAX_BYTES+1)

                      if len(raw)>MAX_BYTES:
                          raise ValueError('Input too large')

                      return json.loads(raw)

                  except Exception:

                      if i+1==attempts:
                          raise

                      time.sleep(2**i)

          # Load original icon sources

          data={
              s:clean(s,fetch(u)['icons'])
              for s,u in SOURCES+EXTRA
          }

          core=custom_icons+[
              r
              for s,_ in SOURCES+EXTRA
              for r in data[s]
          ]

          # Apple App Store cache

          old_cache=read(
              'Apple-iOS-Cache.json',
              {}
          )

          if (
              not isinstance(old_cache,dict)
              or len(old_cache)>MAX_APPS
              or not all(
                  re.fullmatch(
                      r'[a-z]{2}:[0-9]{1,20}',
                      k
                  )
                  and valid_url('iOS',v)
                  for k,v in old_cache.items()
              )
          ):
              raise ValueError('Invalid Apple cache')

          cache={}
          ios=[]
          warnings=[]

          # Update manually selected Apple apps only

          for a in apps:

              key=a['country']+':'+str(a['app_id'])

              try:

                  response=fetch(
                      lookup(a),
                      attempts=1,
                      timeout=15
                  )

                  matches=[
                      r for r in response['results']
                      if isinstance(r,dict)
                      and str(r.get('trackId'))==str(a['app_id'])
                      and r.get('kind')=='software'
                  ]

                  if len(matches)!=1:
                      raise ValueError('Apple app ID mismatch')

                  artwork=next(
                      (
                          matches[0].get(f)
                          for f in (
                              'artworkUrl512',
                              'artworkUrl100',
                              'artworkUrl60'
                          )
                          if valid_url(
                              'iOS',
                              matches[0].get(f)
                          )
                      ),
                      None
                  )

                  if not artwork:
                      raise ValueError('Missing trusted Apple artwork')

              except Exception:

                  artwork=(
                      old_cache.get(key)
                      or a.get('fallback_url')
                  )

                  if not valid_url('iOS',artwork):
                      raise ValueError(
                          'No trusted fallback for '+a['name']
                      ) from None

                  warnings.append(a['name'])

              cache[key]=artwork

              ios.append({
                  'name':a['name'],
                  'url':artwork,
                  'category':a['category']
              })

              time.sleep(3.2)

          ios=clean('iOS',ios)

          core=ios+core

          # Country and region icons

          flags=(
              data['KeLee-Flags']
              +data['Qure-Area']
              +[
                  r for r in core
                  if r['category'].casefold() in {
                      'country',
                      'region',
                      'flag',
                      'flags'
                  }
              ]
          )

          # Streaming and music

          streaming=re.compile(
              r'youtube|netflix|disney|hbo|\bmax\b|hulu|prime.?video|amazon.?video|spotify|paramount|\bviu\b|abema|u.?next|bahamut|baha|巴哈|动画疯|動畫瘋|emby|plex|tver|peacock|dazn|bilibili|twitch|crunchyroll|apple.?tv|\badn\b|animation.?digital.?network|kktv|iqiyi|wetv|fox.?one|rakuten.?viki|sling|starz|fubo|espn|discovery|mytv.?super|now.?tv|now.?player',
              re.I
          )

          media=(
              data['Qure-Media']
              +[
                  r for r in core
                  if r['category'].casefold() in {
                      'media',
                      'music',
                      'streaming',
                      'disney',
                      'warnerbrosdiscovery',
                      'nbcuniversal'
                  }
                  or streaming.search(r['name'])
              ]
          )

          # Artificial intelligence

          ai_pattern=re.compile(
              r'chat.?gpt|open.?ai|claude|anthropic|gemini|deep.?seek|grok|copilot|perplexity|midjourney|doubao|豆包|通义|通義|kimi|qwen|mistral|poe|sora',
              re.I
          )

          ai=[
              r for r in core
              if r['category'].casefold() in {
                  'ai',
                  'spacexai'
              }
              or ai_pattern.search(r['name'])
          ]

          # Apple Color Emoji

          emoji=[]

          for e in fetch(APPLE+'emoji.json'):

              if not isinstance(e,dict) or e.get('obsoleted_by'):
                  continue

              name=(
                  e.get('name')
                  or e.get('short_name')
                  or e.get('unified')
                  or 'Emoji'
              )

              parts=(e.get('unified') or '').split('-')
              region=''

              if len(parts)==2 and all(
                  re.fullmatch(
                      r'1F1[E-F][0-9A-F]',
                      p,
                      re.I
                  )
                  and 0x1F1E6<=int(p,16)<=0x1F1FF
                  for p in parts
              ):

                  region=''.join(
                      chr(int(p,16)-0x1F1E6+65)
                      for p in parts
                  )

              category=(
                  'Country'
                  if region or e.get('subcategory') in {
                      'country-flag',
                      'subdivision-flag'
                  }
                  else 'Emoji'
              )

              if region:
                  name=region+' · '+name

              variants=[(e,name)]+[
                  (v,name+' · '+k)
                  for k,v in (
                      e.get('skin_variations') or {}
                  ).items()
              ]

              for v,label in variants:

                  image=v.get('image') or ''

                  if (
                      v.get('has_img_apple') is True
                      and re.fullmatch(
                          r'[0-9a-f-]+\.png',
                          image,
                          re.I
                      )
                  ):

                      emoji.append({
                          'name':label,
                          'url':APPLE+'img/apple/64/'+image,
                          'category':category
                      })

          emoji=clean('Apple Emoji',emoji)

          apple_flags=[
              r for r in emoji
              if r['category']=='Country'
          ]

          if len(emoji)<1000 or len(apple_flags)<200:
              raise ValueError('Incomplete Emoji source')

          # Generate icon libraries

          plans=[
              ('All.json','全部图标',core+emoji),
              ('Flags.json','全球地区',flags+apple_flags),
              ('Streaming.json','流媒体与音乐',media),
              ('AI.json','人工智能',ai),
              ('Packs/Apple-Emoji.json','Apple Color Emoji',emoji),
              ('Packs/Apple-Flags.json','Apple 地区旗帜',apple_flags),
              ('Packs/Apple-iOS.json','Apple App Store',ios),
          ]+[
              (f'Packs/{s}.json',s,data[s])
              for s,_ in SOURCES
          ]

          # Security: Abnormal change detection

          def changes(file,icons):

              if not icons or len(icons)>MAX_ICONS:
                  raise ValueError('Invalid output count: '+file)

              old=read(file)

              if old is None:

                  if file=='All.json':
                      raise ValueError('Missing previous main index')

                  return

              old_urls={
                  unquote(r['url'])
                  for r in old['icons']
              }

              new_urls={
                  unquote(r['url'])
                  for r in icons
              }

              removed=len(old_urls-new_urls)
              added=len(new_urls-old_urls)

              if (
                  removed>max(
                      10,
                      math.ceil(len(old_urls)*.25)
                  )
                  or added>max(
                      20,
                      math.ceil(len(old_urls)*.50)
                  )
              ):
                  raise ValueError(
                      'SECURITY BLOCK: abnormal change in '+file
                  )

              print(
                  f'CHANGE CHECK: {file}: +{added} / -{removed}'
              )

          prepared={}

          for file,title,rows in plans:

              icons=pack(rows)

              changes(file,icons)

              prepared[file]={
                  'name':'AllanRita · '+title,
                  'description':'Original external image URLs; rights remain with their owners.',
                  'icons':icons
              }

          prepared['Apple-iOS-Cache.json']=cache

          # Generate README

          lines=[
              '# AllanRita Icon Library',
              '',
              'Version: V'+VERSION,
              '',
              'External icon links only. No image mirroring.',
              '',
              '| Index | Icons | Link |',
              '|---|---:|---|'
          ]

          for file,obj in prepared.items():

              if file!='Apple-iOS-Cache.json':

                  lines.append(
                      f'| {file} | {len(obj["icons"])} | [JSON]({BASE+file}) |'
                  )

          lines+=[
              '',
              '## Sources',
              ''
          ]+[
              f'- [{s}]({u})'
              for s,u in SOURCES+EXTRA
          ]

          lines+=[
              '- [Custom.json](Custom.json)',
              '- [Apple Emoji](https://github.com/iamcal/emoji-data) — Emoji 16.0',
              '',
              '## Apple App Store',
              ''
          ]

          for a in apps:

              lines.append(
                  f"- [{a['app_id']}](https://apps.apple.com/{a['country']}/app/id{a['app_id']})"
              )

          lines+=[
              '',
              'Only manually registered apps are queried.',
              '',
              '## Security',
              '',
              'HTTPS, trusted domains and paths, exact app IDs, no index redirects, size and change limits, fixed checkout, restricted staging. Image binaries are not virus-scanned.'
          ]

          encoded={
              file:(
                  json.dumps(
                      obj,
                      ensure_ascii=False,
                      indent=2
                  )+'\n'
              ).encode('utf-8')
              for file,obj in prepared.items()
          }

          encoded['README.md']=(
              '\n'.join(lines)+'\n'
          ).encode('utf-8')

          if any(
              len(b)>MAX_BYTES
              for b in encoded.values()
          ):
              raise ValueError('Output exceeds size limit')

          for file,blob in encoded.items():

              path=safe_path(file)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              path.write_bytes(blob)

          # Security and update report

          report=[
              '## V'+VERSION,
              '',
              f'All icons: {len(prepared["All.json"]["icons"])}',
              f'Apple apps: {len(ios)}',
              f'Apple fallback used: {len(warnings)}',
              '',
              *[f'- {x}' for x in warnings],
              '',
              'Image binaries were not scanned.'
          ]

          print('\n'.join(report))

          if os.environ.get('GITHUB_STEP_SUMMARY'):

              with open(
                  os.environ['GITHUB_STEP_SUMMARY'],
                  'a',
                  encoding='utf-8'
              ) as f:

                  f.write('\n'.join(report)+'\n')

          PY

      - name: Commit validated indexes only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          import subprocess

          files=[
              'Icon/'+x
              for x in (
                  'All.json',
                  'Flags.json',
                  'Streaming.json',
                  'AI.json',
                  'README.md',
                  'Apple-iOS-Cache.json'
              )
          ]

          packs=[
              'Apple-Emoji',
              'Apple-Flags',
              'Apple-iOS',
              'Qure-Color',
              'Qure-Mini',
              'Qure-Light',
              'Orz3-Color',
              'Orz3-Alpha',
              'Orz3-Mini',
              'Orz3-ColorPlus',
              'Orz3-MiniPlus',
              'Lige',
              'Semporia',
              'Oasisic',
              'KeLee',
              'fmz200',
              'KeLee-Flags'
          ]

          files+=[
              'Icon/Packs/'+p+'.json'
              for p in packs
          ]

          subprocess.check_call([
              'git',
              'add',
              '--',
              *files
          ])

          staged={
              p.decode()
              for p in subprocess.check_output([
                  'git',
                  'diff',
                  '--cached',
                  '--name-only',
                  '-z'
              ]).split(b'\0')
              if p
          }

          if not staged.issubset(files):
              raise SystemExit('Unexpected staged files')

          PY

          if git diff --cached --quiet; then

            echo 'No changes'

          else

            git commit -m 'Update Surge icon library V3.2.1 Security iOS Custom'

            auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)

            echo "::add-mask::$auth"

            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main

          fi

      - name: Failure notice
        if: failure()
        run: echo 'Icon update failed; review logs. Previous committed indexes retained unless a push already succeeded.' >> "$GITHUB_STEP_SUMMARY"

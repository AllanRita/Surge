name: Surge Cleanup Inventory and Security Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surge-rule-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Enforce permanent user-directed folder exclusions
        run: python3 .github/scripts/enforce_explicit_exclusions.py

      - name: Download required public security reference feeds
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --max-time 90 \
            https://data.iana.org/TLD/tlds-alpha-by-domain.txt \
            -o "$RUNNER_TEMP/iana-tlds.txt"
          test -s "$RUNNER_TEMP/iana-tlds.txt"
          grep -q '^[A-Z0-9-]\+$' "$RUNNER_TEMP/iana-tlds.txt"

          curl -fsSL --retry 3 --retry-all-errors --max-time 90 \
            https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt \
            -o "$RUNNER_TEMP/openphish-feed.txt"
          test -s "$RUNNER_TEMP/openphish-feed.txt"
          grep -qE '^https?://' "$RUNNER_TEMP/openphish-feed.txt"

          if [ -n "${URLHAUS_AUTH_KEY:-}" ]; then
            if curl -fsSL --retry 2 --retry-all-errors --max-time 90 \
              "https://urlhaus-api.abuse.ch/v2/files/exports/${URLHAUS_AUTH_KEY}/hostfile.txt" \
              -o "$RUNNER_TEMP/urlhaus-hostfile.txt" && test -s "$RUNNER_TEMP/urlhaus-hostfile.txt"; then
              echo "URLhaus authenticated feed downloaded."
            else
              rm -f "$RUNNER_TEMP/urlhaus-hostfile.txt"
              echo "::warning::URLhaus download failed; audit will explicitly report incomplete URLhaus coverage."
              echo "URLhaus download failed; report remains incomplete." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::URLHAUS_AUTH_KEY is not configured; URLhaus coverage will be reported as incomplete."
            echo "URLhaus skipped: repository Actions secret URLHAUS_AUTH_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Re-enforce permanent exclusions before inventory
        run: python3 .github/scripts/enforce_explicit_exclusions.py

      - name: Inventory existing rules and compare cached sources
        run: |
          python3 .github/scripts/cleanup_inventory.py \
            --iana-tlds "$RUNNER_TEMP/iana-tlds.txt" \
            --urlhaus "$RUNNER_TEMP/urlhaus-hostfile.txt" \
            --openphish "$RUNNER_TEMP/openphish-feed.txt"

      - name: Publish inventory reports with concurrent-update retry
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Rebuild reports from the latest main on every retry. This avoids
          # stale generated JSON/Markdown conflicts when maintenance commits overlap.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # A concurrent update or old snapshot must never resurrect a tombstoned folder.
            python3 .github/scripts/enforce_explicit_exclusions.py
            python3 .github/scripts/cleanup_inventory.py \
              --iana-tlds "$RUNNER_TEMP/iana-tlds.txt" \
              --urlhaus "$RUNNER_TEMP/urlhaus-hostfile.txt" \
              --openphish "$RUNNER_TEMP/openphish-feed.txt"

            git add -A -- Rule/Upstream
            if git diff --cached --quiet; then
              echo 'Inventory report unchanged'
              exit 0
            fi

            git commit -m 'Generate frozen Surge cleanup inventory and security audit'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Concurrent main update detected; rebuilding the audit report (attempt $attempt of 3)."
          done
          echo 'Could not publish audit reports after three concurrent-update retries.'
          exit 1

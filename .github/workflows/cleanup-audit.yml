name: Surge Cleanup Inventory and Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cleanup_inventory.py'
      - '.github/scripts/remove_invalid_public_tld_rules.py'
      - '.github/workflows/cleanup-audit.yml'
      - 'Rule/Upstream/**/*.list'
      - 'Rule/Upstream/SourceMetadata/**'
      - 'Rule/CONSOLIDATION-PLAN.json'
      - 'Rule/CONSOLIDATED-INDEX.md'

permissions:
  contents: write

concurrency:
  group: surge-rule-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Download public security reference feeds (not rule authors)
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: |
          set +e
          curl -fsSL --retry 2 --max-time 60 https://data.iana.org/TLD/tlds-alpha-by-domain.txt -o "$RUNNER_TEMP/iana-tlds.txt"
          if [ -n "${URLHAUS_AUTH_KEY:-}" ]; then
            curl -fsSL --retry 2 --max-time 60 "https://urlhaus-api.abuse.ch/v2/files/exports/${URLHAUS_AUTH_KEY}/hostfile.txt" -o "$RUNNER_TEMP/urlhaus-hostfile.txt"
          else
            echo "URLhaus skipped: repository Actions secret URLHAUS_AUTH_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
          curl -fsSL --retry 2 --max-time 60 https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt -o "$RUNNER_TEMP/openphish-feed.txt"
          exit 0

      - name: Remove verified non-IANA root suffix
        run: python3 .github/scripts/remove_invalid_public_tld_rules.py --iana-tlds "$RUNNER_TEMP/iana-tlds.txt"

      - name: Inventory existing rules and compare cached sources
        run: |
          python3 .github/scripts/cleanup_inventory.py \
            --iana-tlds "$RUNNER_TEMP/iana-tlds.txt" \
            --urlhaus "$RUNNER_TEMP/urlhaus-hostfile.txt" \
            --openphish "$RUNNER_TEMP/openphish-feed.txt"

      - name: Publish inventory reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- Rule/Upstream
          if git diff --cached --quiet; then
            echo 'Inventory report unchanged'
            exit 0
          fi
          git commit -m 'Generate frozen Surge cleanup inventory and security audit'
          git push origin HEAD:main
